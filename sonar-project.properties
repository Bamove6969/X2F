# Same scope as the local scan (organization and project key come from the workflow).
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-fixtures/**,**/dist-fixtures-*/**,**/coverage/**,**/fixtures/**,**/test/fixtures/**,**/*.dc.html,**/test-results/**,**/playwright-report/**,**/.scratch/**,**/.claude/**,**/.regtest/**,**/*.png,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/e2e/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/e2e/**
sonar.test.exclusions=**/node_modules/**,**/fixtures/**
sonar.sourceEncoding=UTF-8
