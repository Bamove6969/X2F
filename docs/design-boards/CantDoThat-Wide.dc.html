<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Can't do that (wide)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600&amp;family=Atkinson+Hyperlegible+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</helmet>
<div style="{{rootStyle}}">
  <nav aria-label="Main" style="width: 240px; flex-shrink: 0; box-sizing: border-box; padding: 24px 16px; border-right: 1px solid var(--surface-raised); display: flex; flex-direction: column; gap: 8px;">
    <span style="font-family: 'Familjen Grotesk', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; padding: 0 8px 16px;">X2F</span>
    <a href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 6px; color: var(--ink-muted); text-decoration: none;">Trade</a>
    <a href="#" aria-current="page" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 6px; background: var(--surface-raised); color: var(--ink); font-weight: 600; text-decoration: none;">Post offer</a>
    <a href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 6px; color: var(--ink-muted); text-decoration: none;">Wallets</a>
    <a href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; border-radius: 6px; color: var(--ink-muted); text-decoration: none;">Profile</a>
  </nav>
  <main style="flex-grow: 1; padding: 32px 48px; display: flex; flex-direction: column; gap: 16px;" aria-hidden="true">
    <span style="font-family: 'Familjen Grotesk', sans-serif; font-size: 24px; font-weight: 600;">Post an offer</span>
    <span style="width: 720px; height: 56px; border-radius: 12px; background: var(--surface);"></span>
    <span style="width: 720px; height: 120px; border-radius: 12px; background: var(--surface);"></span>
    <span style="width: 720px; height: 56px; border-radius: 12px; background: var(--surface);"></span>
  </main>

  <sc-if value="{{open}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center;">
      <section role="dialog" aria-modal="true" aria-labelledby="cdtw-title" style="width: 480px; box-sizing: border-box; padding: 32px; border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 16px;">
        <h2 id="cdtw-title" style="margin: 0; font-family: 'Familjen Grotesk', sans-serif; font-size: 24px; line-height: 30px; font-weight: 600;">You can't do that yet</h2>
        <p style="margin: 0; font-size: 16px; line-height: 24px;">{{message}}</p>
        <p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">If you feel this feature can be improved please leave <a href="Feedback-Wide.dc.html" style="color: var(--monero-ink); padding: 14px 0;">feedback</a>.</p>
        <div style="display: flex; justify-content: flex-end;">
          <button type="button" onClick="{{close}}" style="height: 48px; min-width: 120px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--monero); color: var(--on-monero); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;">OK</button>
        </div>
      </section>
    </div>
  </sc-if>
  <sc-if value="{{closed}}" hint-placeholder-val="{{false}}">
    <button type="button" onClick="{{reopen}}" style="position: absolute; right: 48px; bottom: 32px; height: 44px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-family: inherit; font-size: 15px; cursor: pointer;">Show the message again</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["night","day"],"default":"night"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: true }; }
  renderVals() {
    const THEMES = {
      night: '--ground:#0e1116;--surface:#171b22;--surface-raised:#20262f;--line:#6b7584;--ink:#eef1f5;--ink-muted:#9aa4b2;--monero:#ff7a1a;--monero-ink:#ff7a1a;--on-monero:#1a0e05;--escrow:#4cc3d9;--caution:#f2c14e;--danger:#ff6b8a;--scrim:rgba(0,0,0,0.6);',
      day: '--ground:#f5f6f8;--surface:#ffffff;--surface-raised:#eceef2;--line:#7a8494;--ink:#12161c;--ink-muted:#566070;--monero:#f26822;--monero-ink:#b84a00;--on-monero:#1a0e05;--escrow:#0b7285;--caution:#8a5a00;--danger:#c2255c;--scrim:rgba(18,22,28,0.45);'
    };
    const theme = this.props.theme === 'day' ? 'day' : 'night';
    const rootStyle = THEMES[theme] + "position: relative; width: 1280px; height: 800px; box-sizing: border-box; overflow: hidden; background: var(--ground); color: var(--ink); font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; display: flex;";
    return {
      rootStyle,
      open: this.state.open,
      closed: !this.state.open,
      message: "Sorry, you're limited to 2 offers per side (buying or selling) for each currency.",
      close: () => this.setState({ open: false }),
      reopen: () => this.setState({ open: true })
    };
  }
}
</script>
</body>
</html>
