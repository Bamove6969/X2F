<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post an offer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600&amp;family=Atkinson+Hyperlegible+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--monero-ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input::placeholder,textarea::placeholder{color:var(--ink-muted)}
</style>
</helmet>
<div style="{{rootStyle}}">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px; border-bottom: 1px solid var(--surface-raised);">
    <a href="Main.dc.html" aria-label="Close" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: var(--ink);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Familjen Grotesk', sans-serif; font-size: 22px; font-weight: 600;">Post an offer</h1>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px;">
    <section style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted);">I want to</span>
      <div role="radiogroup" aria-label="I want to" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <button type="button" role="radio" aria-checked="{{sellOn}}" onClick="{{pickSell}}" style="{{sellStyle}}">Sell XMR</button>
        <button type="button" role="radio" aria-checked="{{buyOn}}" onClick="{{pickBuy}}" style="{{buyStyle}}">Buy XMR</button>
      </div>
    </section>

    <section style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px;">
      <label for="method" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-muted);">Payment method
        <select id="method" style="height: 48px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink); font-family: inherit; font-size: 16px;">
          <option>Zelle</option><option>Cash App</option><option>Cash by mail</option><option>Bank transfer (ACH)</option><option>Custom method</option>
        </select>
      </label>
      <label for="currency" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-muted);">Currency
        <select id="currency" style="height: 48px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink); font-family: inherit; font-size: 16px;">
          <option>USD</option><option>EUR</option><option>GBP</option>
        </select>
      </label>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted);">Your price</span>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border-radius: 12px; background: var(--surface);">
        <button type="button" aria-label="Lower margin by 0.1%" onClick="{{down}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 22px; cursor: pointer;">−</button>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <span style="font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 24px; line-height: 28px;">{{marginText}}</span>
          <span style="font-size: 13px; color: var(--ink-muted);">{{marginWord}}</span>
        </div>
        <button type="button" aria-label="Raise margin by 0.1%" onClick="{{up}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 22px; cursor: pointer;">+</button>
      </div>
      <span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">Market $329.90 / XMR right now. Your price follows the market, so it's always <span style="color: var(--ink);">{{priceNow}}</span> at today's rate.</span>
    </section>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <label for="min" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-muted);">Smallest trade
        <input id="min" type="text" inputmode="decimal" value="$50" style="height: 48px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink); font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 16px;">
      </label>
      <label for="max" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-muted);">Largest trade
        <input id="max" type="text" inputmode="decimal" value="$2,000" style="height: 48px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink); font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 16px;">
      </label>
    </section>

    <label for="terms" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-muted);">Your terms (optional)
      <textarea id="terms" rows="3" placeholder="e.g. Zelle only from an account in your own name. Put the trade number in the memo." style="padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink); font-family: inherit; font-size: 16px; resize: none;"></textarea>
    </label>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted);">Who can trade with you</span>
      <label for="mintrades" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 15px;">Minimum completed trades
        <select id="mintrades" style="height: 44px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink); font-family: inherit; font-size: 15px;">
          <option>Anyone</option><option>5+</option><option>10+</option><option>50+</option>
        </select>
      </label>
    </section>

    <section aria-label="Preview" style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted);">How others will see it</span>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 12px; border: 1px dashed var(--line);">
        <span style="font-size: 13px; color: var(--ink-muted);">{{previewLine}}</span>
        <div style="display: flex; align-items: flex-end; justify-content: space-between;">
          <span style="font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 24px;">{{priceNow}}</span>
          <span style="font-size: 13px; color: var(--ink-muted);">$50 – $2,000</span>
        </div>
      </div>
    </section>
  </main>

  <footer style="padding: 16px; border-top: 1px solid var(--surface-raised);">
    <a href="SetupTerms.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border: 0; border-radius: 12px; background: var(--monero); color: var(--on-monero); font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer; text-decoration: none;">Post offer</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["night","day"],"default":"night"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { side: 'sell', margin: 0.5 };
  }
  renderVals() {
    const THEMES = {
      night: '--ground:#0e1116;--surface:#171b22;--surface-raised:#20262f;--line:#6b7584;--ink:#eef1f5;--ink-muted:#9aa4b2;--monero:#ff7a1a;--monero-ink:#ff7a1a;--on-monero:#1a0e05;--escrow:#4cc3d9;--caution:#f2c14e;--danger:#ff6b8a;--scrim:rgba(0,0,0,0.6);--mod:#b69cff;',
      day: '--ground:#f5f6f8;--surface:#ffffff;--surface-raised:#eceef2;--line:#7a8494;--ink:#12161c;--ink-muted:#566070;--monero:#f26822;--monero-ink:#b84a00;--on-monero:#1a0e05;--escrow:#0b7285;--caution:#8a5a00;--danger:#c2255c;--scrim:rgba(18,22,28,0.45);--mod:#6741d9;'
    };
    const theme = this.props.theme === 'day' ? 'day' : 'night';
    const rootStyle = THEMES[theme] + "width: 390px; height: 844px; box-sizing: border-box; background: var(--ground); color: var(--ink); font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; display: flex; flex-direction: column;";
    const { side, margin } = this.state;
    const market = 329.90;
    const price = market * (1 + margin / 100);
    const sideBtn = (on) => 'height: 48px; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; ' + (on
      ? 'border: 2px solid var(--ink); background: var(--surface-raised); color: var(--ink);'
      : 'border: 1px solid var(--line); background: transparent; color: var(--ink-muted);');
    const m = Math.round(margin * 10) / 10;
    const step = (d) => () => this.setState({ margin: Math.max(-10, Math.min(10, Math.round((this.state.margin + d) * 10) / 10)) });
    return { rootStyle,
      sellOn: side === 'sell' ? 'true' : 'false',
      buyOn: side === 'buy' ? 'true' : 'false',
      sellStyle: sideBtn(side === 'sell'),
      buyStyle: sideBtn(side === 'buy'),
      pickSell: () => this.setState({ side: 'sell' }),
      pickBuy: () => this.setState({ side: 'buy' }),
      marginText: (m > 0 ? '+' : '') + m.toFixed(1) + '%',
      marginWord: m === 0 ? 'at market' : (m > 0 ? 'above market' : 'below market'),
      priceNow: '$' + price.toFixed(2) + ' / XMR',
      previewLine: (side === 'sell' ? 'Selling XMR' : 'Buying XMR') + ' via Zelle · USD · you',
      up: step(0.1),
      down: step(-0.1)
    };
  }
}
</script>
</body>
</html>
