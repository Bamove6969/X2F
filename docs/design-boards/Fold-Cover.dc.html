<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fold: Flip cover screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600&amp;family=Atkinson+Hyperlegible+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</helmet>
<div style="{{rootStyle}}">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
    <span style="font-size: 13px; color: var(--ink-muted);">X2F · +2 more trades</span>
    <span style="{{statusStyle}}">{{statusLabel}}</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <h1 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600;">Buying from nightowl_44</h1>
    <span style="font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 24px; line-height: 30px; font-weight: 500;">$412.50 <span style="font-size: 14px; color: var(--ink-muted);">USD</span></span>
    <span style="font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 14px; color: var(--ink-muted);">1.250000 XMR</span>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--surface);">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="{{iconStyle}}"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <div style="display: flex; flex-direction: column; min-width: 0;">
      <span style="font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 20px; line-height: 24px; font-weight: 500;">{{timer}}</span>
      <span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">{{timerNote}}</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; margin-top: auto;">
    <button type="button" onClick="{{open}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 999px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="16" rx="1.5"/></svg>
      Open on main screen
    </button>
    <sc-if value="{{asked}}" hint-placeholder-val="{{false}}">
      <span role="status" style="font-size: 13px; line-height: 18px; color: var(--ink-muted); text-align: center;">Open your phone to keep going.</span>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["night","day"],"default":"night"},"variant":{"editor":"enum","options":["waiting-payment","paid","dispute"],"default":"waiting-payment"},"$preview":{"width":360,"height":380}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { asked: false }; }
  renderVals() {
    const THEMES = {
      night: '--ground:#0e1116;--surface:#171b22;--surface-raised:#20262f;--line:#6b7584;--ink:#eef1f5;--ink-muted:#9aa4b2;--monero:#ff7a1a;--monero-ink:#ff7a1a;--on-monero:#1a0e05;--escrow:#4cc3d9;--caution:#f2c14e;--danger:#ff6b8a;--scrim:rgba(0,0,0,0.6);',
      day: '--ground:#f5f6f8;--surface:#ffffff;--surface-raised:#eceef2;--line:#7a8494;--ink:#12161c;--ink-muted:#566070;--monero:#f26822;--monero-ink:#b84a00;--on-monero:#1a0e05;--escrow:#0b7285;--caution:#8a5a00;--danger:#c2255c;--scrim:rgba(18,22,28,0.45);'
    };
    const theme = this.props.theme === 'day' ? 'day' : 'night';
    const rootStyle = THEMES[theme] + "position: relative; width: 360px; height: 380px; box-sizing: border-box; overflow: hidden; border-radius: 40px; padding: 24px; background: var(--ground); color: var(--ink); font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px;";
    const V = {
      'waiting-payment': { label: 'Pay now', tone: 'var(--caution)', timer: '62 min left', note: "Send by Zelle, then tap I've paid" },
      paid: { label: 'You paid', tone: 'var(--escrow)', timer: '1 h 58 min', note: 'Left for nightowl_44 to check and release' },
      dispute: { label: 'Dispute open', tone: 'var(--danger)', timer: 'Opened 12 min ago', note: 'A moderator usually replies within 4 hours' }
    };
    const v = V[this.props.variant] || V['waiting-payment'];
    return {
      rootStyle,
      statusLabel: v.label,
      statusStyle: 'display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; background: var(--surface-raised); color: ' + v.tone + '; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;',
      iconStyle: 'flex-shrink: 0; color: ' + v.tone + ';',
      timer: v.timer,
      timerNote: v.note,
      asked: this.state.asked,
      open: () => this.setState({ asked: true })
    };
  }
}
</script>
</body>
</html>
