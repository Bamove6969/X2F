const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const done=q=>{const a=A[q.id];return !!a&&(a.choice!=null||(a.own||'').trim()!=='')};
function status(t,b){const s=$('save');s.textContent=t;s.className='save'+(b?' bad':'')}
function draft(s){try{if(s)localStorage.setItem('x2f-w08',JSON.stringify(A));else return JSON.parse(localStorage.getItem('x2f-w08')||'{}')}catch(e){}return {}}
async function save(q){draft(1);if(!db){status('Saved on this device only. Tell the lead.',1);return}
 try{await db.doc('answers/'+q.id).set({n:q.n0,question:q.q,...A[q.id]});status('Saved. The lead can read this answer.')}catch(e){status('That answer did not save. Try it again.',1)}}
function render(){const n=Q.filter(done).length;$('count').textContent=n+'/'+Q.length+' answered';$('bar').style.width=(n/Q.length*100)+'%';
 const c=$('card');c.replaceChildren();
 if(pos>=Q.length){c.append(el('h2',null,n===Q.length?'All answered':n+' of '+Q.length+' answered'),el('p','note','Tell the lead you\'re done.'));const b=el('button','btn','Back');b.onclick=()=>{pos=Q.length-1;render()};c.append(b);return}
 const q=Q[pos],cur=A[q.id];c.append(el('div','tag',q.s+' · '+(pos+1)+' of '+Q.length),el('h2',null,q.q));if(q.n)c.append(el('p','note',q.n));
 const o=el('div','opts');o.setAttribute('role','radiogroup');o.setAttribute('aria-label','Your answer');
 q.o.forEach((l,i)=>{const b=el('button','opt');b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(!!cur&&cur.choice===l));const t=el('span',null,l+' ');if(i===q.r)t.append(el('span','rec','(Recommended)'));b.append(t);
  b.onclick=()=>{A[q.id]={choice:l,own:'',at:new Date().toISOString()};save(q);render();clearTimeout(tm);tm=setTimeout(()=>{pos++;render()},350)};o.append(b)});c.append(o);
 const lb=el('label',null,'Or write your own answer');lb.htmlFor='own-'+q.id;const ta=el('textarea');ta.id='own-'+q.id;ta.placeholder='Type your full answer here';ta.value=cur&&cur.own||'';
 let t2=null;ta.oninput=()=>{clearTimeout(t2);status('Saving…');t2=setTimeout(()=>{A[q.id]={choice:null,own:ta.value,at:new Date().toISOString()};save(q);[...o.children].forEach(b=>b.setAttribute('aria-checked','false'))},600)};c.append(lb,ta);
 const nv=el('div','nav'),bk=el('button','btn','Back');bk.disabled=pos===0;bk.onclick=()=>{pos--;render()};const nx=el('button','btn pri',pos<Q.length-1?'Next':'Finish');nx.onclick=()=>{pos++;render()};nv.append(bk,nx);c.append(nv)}
A=draft();render();
(async()=>{db=window.claude?await claude.use('db').catch(()=>null):null;if(!db){status('Answers are saving on this device only. Tell the lead.',1);return}
 try{const s=await db.collection('answers').get();(s.docs||s).forEach(d=>{const v=d.data?d.data():d;if(d.id)A[d.id]={choice:v.choice??null,own:v.own||'',at:v.at}});status('Ready. Answers save as you tap.');const f=Q.findIndex(q=>!done(q));if(f>0)pos=f;render()}catch(e){status('Could not load saved answers. New answers will still save.',1)}})();
</script>
