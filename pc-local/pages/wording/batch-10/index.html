is tapped with a required box empty, a box over its length, a line break in a one-line box, or more than 8 lines in the address. The box's own label fills the blank.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"TradeChat","q":"Sign this line? \"Check the details and try again.\" / \"Leave out hidden characters.\"","n":"Shown on the TradeChat screen: the fallback error when the worker refuses a package the page's own check let through, and the hidden-characters case.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"TradeChat","q":"Sign this line? \"Payment details\" / \"Email: name@example.com\"","n":"Shown on the TradeChat screen: the card both sides see once the package is sent: the heading, then one \"Label: value\" row per filled box, in the method table's order. The same plain text is what older readers and the screen reader get. \"Payment details\" is already on batch 5 (BuyerPay's label); here it is the card's heading in the chat.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"TradeChat","q":"Sign this line? Zelle: \"Email\" / \"US phone number\" / \"Name on the account\"","n":"Shown on the TradeChat screen: the boxes for Zelle (email or US phone number, one is enough; the name optional). Research pack row 1. Required vs optional per method: owner questions p11-108 to p11-117.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"TradeChat","q":"Sign this line? Interac e-Transfer: \"Full name\" / \"Email\" / \"Phone number\"","n":"Shown on the TradeChat screen: the boxes for Interac e-Transfer (the name required; email or phone, one is enough, owner p7-3).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"TradeChat","q":"Sign this line? SEPA and SEPA Instant: \"Name on the account\" / \"IBAN\" / \"BIC\"","n":"Shown on the TradeChat screen: the boxes for SEPA and SEPA Instant (name and IBAN required; BIC email, CPF/CNPJ or random key)\" / \"Name on the account\"","n":"Shown on the TradeChat screen: the boxes for Pix (the key required; the name optional).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"TradeChat","q":"Sign this line? UPI: \"UPI ID\" / \"Mobile number registered with UPI\" / \"Account number and IFSC\" / \"Name on the account\"","n":"Shown on the TradeChat screen: the boxes for UPI (one of the three; the name optional).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"TradeChat","q":"Sign this line? Cash by mail: \"Full name\" / \"Mailing address\"","n":"Shown on the TradeChat screen: the boxes for cash by mail (both required; the address is the one multi-line box, up to 8 lines).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"TradeChat","q":"Sign this line? ACH: \"Name on the account\" / \"Routing number\" / \"Account number\"","n":"Shown on the TradeChat screen: the boxes for ACH (all three required). Not in the research pack: taken from the launch profile's fields.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"TradeChat","q":"Sign this line? Any other method: \"Payment details\"","n":"Shown on the TradeChat screen: the one free-text box for a method outside the table (CUSTOM included), the same words as the card's heading.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"SetupPassword","q":"Sign this line? \"Strength: Weak\" / \"Strength: Medium\" / \"Strength: Strong\"","n":"Shown on the SetupPassword screen: the live meter under the password box, with three bars (owner 1 Nov, S-014: weak, then medium, then strong, and only a strong password is accepted). The owner left the levels' words to design.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"SetupPassword","q":"Sign this line? \"Strength: Checking…\"","n":"Shown on the SetupPassword screen: the meter's level for a password that meets every rule before the server has said whether it is on the leaked list (signup-rules review S4). Owner question p11-99: as built the meter never reads Strong before the tap (only the server knows the leaked list, and its answer is the sign-up itself), so \"Checking…\" shows while nothing is being checked yet and \"Set password\" is enabled under it. The reviewer recommends a word that promises only the rules, for example \"Meets the rules\".","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"SetupBackup","q":"Sign these 2 lines? \"Save your recovery codes\" | \"X2F has no email address or phone number for you, so if you lose your key or forget your password, a recovery code is your emergency way back in.\"","n":"Shown on the SetupBackup screen, in this order: 1) the title; 2) the lead of the new first step. Owner 1 Nov (register S-017, lead job J-09): recovery codes are required at sign-up, so there is no \"Skip for now\" until they are saved. Batch 1's \"Add a backup way to log in\" moves to the second step.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"SetupBackup","q":"Sign these 2 lines? \"Show my recovery codes\" | \"Save these now. Each works once, and you will not see them again.\"","n":"Shown on the SetupBackup screen, in this order: 1) the button that makes the codes; 2) the line above the list of codes (ten today; the code's format is still open, S-018 and S-019).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"SetupBackup","q":"Sign these 3 lines? \"Type or paste code 3 from your list\" | \"That is not code 3. Check what you wrote down.\" | \"Continue\"","n":"Shown on the SetupBackup screen, in this order: 1) the type-back box's label (one code picked at random); 2) its error; 3) the button, enabled once the tick is on and the code matches. The tick \"I've written it down\" is the owner's words (S-017) and is already on batch 1. Owner question p11-98 (S-017's type-back vs one tap) is open.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"SetupBackup","q":"Sign this line? \"Could not make recovery codes. Try again.\"","n":"Shown on the SetupBackup screen: the error when the codes cannot be made.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"SetupBackup","q":"Sign these 2 lines? \"Add another backup (optional)\" | \"A security key or a second PGP key also gets you back in. You can add one later in Settings.\"","n":"Shown on the SetupBackup screen, in this order: 1) the title; 2) the lead of the second step, after the codes are saved. An authenticator app is no longer offered here (design build gaps Job 1, board Login-Backup); \"Skip for now\" goes on to the wallet.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign these 3 lines? \"Pick up to 5. Each currency has its own bands; nothing is converted.\" | \"Add a currency\" | \"That's 5 currencies, the most one offer can have.\"","n":"Shown on the FlexOffer-Post screen (Post an offer), in this order: 1) the help under \"Currencies\"; 2) the picker's label and its empty entry (the board has \"More\"); 3) the line in its place at 5. Batch 4 has the board's \"Pick up to 5. You set the smallest and largest trade for each one.\"","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign these 3 lines? \"Pick at least one currency.\" | \"Remove USD\" | \"Currency\"","n":"Shown on the FlexOffer-Post screen, in this order: 1) the error with no currency; 2) the picked currency chip's accessible label; 3) the fiat side of the XMR / currency switch when the offer has several currencies (with one it reads the code, \"USD\").","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign this line? \"🇨🇦 CAD · no rate\"","n":"Shown on the FlexOffer-Post screen: a picker entry for a currency with no market rate (owner Q24: kept and marked, back the moment its rate is). The \"no rate\" tag is the lead's interim; design decides tag or hide (J-32, O-020 and O-021). The boards say \"No rate right now\" (batch 4, OfferAd) and \"no rate right now\" (batch 4, MyOffers).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign these 2 lines? \"Trade sizes and prices\" | \"Set a different price for different trade sizes. Bands are whole units with no gaps: one ends at 500, the next starts at 501. Two bands on the same amounts need another price or another minimum of completed trades.\"","n":"Shown on the FlexOffer-Post screen, in this order: 1) the section title; 2) its help. The board's version (batch 4) reads \"...whole units, in order, with no gaps... Each currency has its own bands; nothing is converted.\" Bands that differ only by price is owner question p11-96.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign this line? \"Market $329.90 / XMR (about $329.90) right now. Your prices follow the market.\"","n":"Shown on the FlexOffer-Post screen: the line at the top of each currency's card (the USD value only for another currency). The board's line (batch 4) ends \"...Your price follows the market, so it's always $332.54 / XMR at today's rate.\", which no longer fits several bands.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign this line? \"In XMR each currency has one band.\" / \"To set amounts in XMR, keep one band per currency.\"","n":"Shown on the FlexOffer-Post screen: the line in place of \"Add a band\" while amounts are in XMR, and the line under the unit help when the switch to XMR is blocked by a currency with several bands. One band per currency in XMR is a lead default, pending the owner.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign these 2 lines? \"Remove this band\" | \"That's 3 bands, the most one currency can have.\"","n":"Shown on the FlexOffer-Post screen, in this order: 1) each band's remove button when there are several (the board says \"Remove band\"); 2) the line in place of \"Add a band\" at the cap. The board (batch 4) says 5 bands; the owner's Q23 says 3 per currency, and design is told to redraw to 3.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign these 3 lines? \"Two bands cover the same amounts with the same price and the same minimum of completed trades. Change one of them.\" | \"Bands can't leave a gap: the next band starts at $501.\" | \"Fix the bands of this currency.\"","n":"Shown on the FlexOffer-Post screen, in this order: the currency's band errors when Post offer is tapped: 1) two bands the same; 2) a gap; 3) any other band fault. The board (batch 4) has \"This band overlaps band 1.\" / \"Bands must be contiguous: the next band starts at $501.\"","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign these 3 lines? \"Percentage\" | \"Enter a percentage from 0 to 50, like 0.5.\" | \"Set your percentage\"","n":"Shown on the FlexOffer-Post screen, in this order: 1) the label of the box where the vendor types the percentage above or below the market (owner F1: at most 50%; the board says \"Percent\"); 2) its error when empty, not a number or over 50 (the board has \"Up to 50%.\" / \"Set 50% or less.\" / \"Enter a percent.\"); 3) the preview's big price before the first band has a valid percentage. Design flagged these words (DESIGN: wording).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign this line? \"≈ 0.500000 XMR at your price (+0.5%)\"","n":"Shown on the FlexOffer-Post screen: under each band box, the other unit at this band's price (boards v142).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign these 3 lines? \"Pick every payment method you take. Each one has its own payment instructions and can change the price by a percent.\" | \"Add a payment method\" | \"That's 5 payment methods, the most one offer can have.\"","n":"Shown on the FlexOffer-Post screen, in this order: 1) the help under \"Payment methods\" (the board says \"Pick every method you take...\"); 2) the picker's label; 3) the line in its place at 5 (owner Q23).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign these 3 lines? \"Pick at least one payment method.\" | \"Remove\" | \"Price change\" / \"No change\" / \"+2.0%\" / \"−0.5%\"","n":"Shown on the FlexOffer-Post screen, in this order: 1) the error with no method (the board has \"Pick at least one payment method to post this offer.\"); 2) a method's remove button; 3) the method's stepper label and its values in steps of 0.5%, from −5% to +10% (the board has \"Price with Zelle\" / \"Same as band\").","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign this line? \"Lower the price change for Zelle\" / \"Raise the price change for Zelle\"","n":"Shown on the FlexOffer-Post screen: the stepper buttons' accessible labels (screen readers only).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign these 2 lines? \"Payment instructions\" / \"Payment instructions (USD)\" | \"What the other person needs to know to pay you in USD.\"","n":"Shown on the FlexOffer-Post screen, in this order: 1) the instructions box's label, shared or per currency when \"Same for all currencies\" is off (the board says \"Payment instructions for Zelle\"); 2) the per-currency box's placeholder. The shared placeholder and \"Same for all currencies\" are on batch 4.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign this line? \"A band's price plus a payment method's price change can't pass 50% either way.\"","n":"Shown on the FlexOffer-Post screen: the error when a band's percentage and a method's change add up past ±50% (the API's rule).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign these 2 lines? \"Your payment instructions contain hidden characters (for example from copying formatted text). Retype the part you pasted.\" | \"Keep each set of payment instructions under 1,000 characters.\"","n":"Shown on the FlexOffer-Post screen: the terms box's two errors, said of payment instructions.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign this line? \"Enter an amount, like 50 or 2,000.\"","n":"Shown on the FlexOffer-Post screen: a band end in a currency that is not an amount (whole units, O-018). The board (batch 4) has \"Enter both amounts.\"; \"Whole units only, no cents.\" is already on batch 4.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign these 2 lines? \"Selling XMR via Zelle, PayPal · USD, CAD · you · 5+ completed trades\" | \"Zelle · PayPal +2.0%\"","n":"Shown on the FlexOffer-Post screen, in this order: 1) the preview's first line, now with comma lists of methods and currencies, and the lowest trade rule when every band asks for one (the board has \"Selling XMR via Zelle · USD, EUR · you\"); 2) the preview's methods line with each method's price change.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"FlexOffer-Post","q":"Sign this line? \"One of these payment methods isn't available right now. Remove it and post again.\"","n":"Shown on the FlexOffer-Post screen: the refusal when one of the offer's methods is off the list (was \"This payment method isn't available right now. Choose another one.\" with one method).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"MyOffers","q":"Sign this line? \"Selling XMR · USD, CAD\" / \"Zelle, PayPal\"","n":"Shown on the MyOffers screen: an offer's title line and method line with several currencies or methods, as comma lists. The board (batch 4) uses dots: \"Selling XMR · USD · CAD\" / \"Zelle · PayPal +2.0% · 2 bands · follows the market\".","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"MyOffers","q":"Sign this line? \"On, hidden: no market price for its currencies right now\"","n":"Shown on the MyOffers screen: the row's status when none of the offer's currencies has a market price (Task 34 review M4). The board (batch 4) has \"Not live · no rate\" and \"We can't get a rate for ARS, so this offer can't go live. It goes live by itself when the rate is back.\"","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyOffers","q":"Sign this line? \"+0.4%\" / \"−0.4%\" over \"Vendor markup\", \"0%\" over \"At market\"","n":"Shown on the BuyOffers and SellOffers screens: the offer card's bottom-left figure in mono over its label (owner 8 Nov; boards v142). Every offer is market ± % now (owner Q1: no fixed-price offers), so the \"Fixed price\" label and the \"+$0.10\" marks are gone. \"At market\" is on batch 3; \"Vendor markup\" and the marks are not.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign these 3 lines? \"What applies to you\" | \"You're buying from a sell ad · information only\" / \"You're selling to a buy ad · information only\" / \"A trade on your sell ad · information only\" / \"A trade on your buy ad · information only\" | \"Show all 14\" / \"Show less\"","n":"Shown on the BuyQuote, SellQuote and OfferAd screens, in this order: 1) the section title; 2) its subtitle per reader (taker on a sell ad, taker on a buy ad, poster selling, poster buying); 3) the toggle (the count is the reader's lines). Owner T-034 / T-080, 9 Nov: each reader sees only their own lines; information only, no agree step. Every line below is the board's, word for word.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign this line? \"Your responsibilities\" / \"What affects you\" / \"Your options\"","n":"Shown on the BuyQuote, SellQuote and OfferAd screens: the three group titles, each with its count. Collapsed, the first line of each group shows.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign these 3 lines? \"Fund the escrow in full.\" | \"Send your payment details from the card in the trade chat: it asks for that method's fields and posts them as one message.\" | \"Pick the currency, then the payment type, on the ad.\"","n":"Shown on the BuyQuote, SellQuote and OfferAd screens under \"Your responsibilities\": the seller's lines (the first two for both seller roles; the third for takers only).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign these 2 lines? \"Gift card: check it within 45 minutes of getting its details.\" | \"Gift card: bought in the last 30 days, full written value, and a video of you logging into it before you send.\"","n":"Shown on the BuyQuote, SellQuote and OfferAd screens under \"Your responsibilities\": the seller's and the buyer's gift-card lines.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign these 3 lines? \"Pay only when \\\"Pay now\\\" shows; it never shows before the escrow is secured.\" | \"Tap \\\"I've paid\\\" once the money is sent.\" | \"Follow the payment instructions for the type you picked.\"","n":"Shown on the BuyQuote, SellQuote and OfferAd screens under \"Your responsibilities\": the buyer's lines (the third for takers only).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign these 3 lines? \"We recommend paying from an account in your own name: it lowers the chance of the payment being frozen. We protect your identity either way.\" | \"Post proof with the trade code, amount and time visible.\" | \"Answer a trade request within 60 minutes, or it closes.\"","n":"Shown on the BuyQuote, SellQuote and OfferAd screens under \"Your responsibilities\": the buyer's two lines, and the first line of both poster lists.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign these 3 lines? \"The buyer only sees \\\"Pay now\\\" once your escrow is secured.\" | \"The buyer can cancel until they tap \\\"I've paid\\\"; your XMR comes back.\" | \"After \\\"I've paid\\\", the buyer waits for the payment method's transfer time before a dispute (Zelle: 90 min). It's shown where the method is picked.\"","n":"Shown on the BuyQuote, SellQuote and OfferAd screens under \"What affects you\": the seller's lines, 1 to 3 of 13.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign these 3 lines? \"Once the buyer taps \\\"I've paid\\\", neither of you can cancel.\" | \"After the time to pay, the buyer can still pay until you cancel. If they paid and you cancel, they can dispute at once.\" | \"Before the XMR is released, a pop-up asks you to confirm the payment arrived. You can turn it off.\"","n":"Shown on the BuyQuote, SellQuote and OfferAd screens under \"What affects you\": the seller's lines, 4 to 6 (owner p6-1: the time to pay is not a hard end).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign these 2 lines? \"Proofs show the trade code, amount and time; our privacy tool hides names and account numbers.\" | \"You're warned if a proof has no readable date.\"","n":"Shown on the BuyQuote, SellQuote and OfferAd screens under \"What affects you\": the seller's lines, 7 and 8. The board's \"[lead writes the wording]\" line (the first-month privacy-tool check, p9-8 / Q47) is left out until it is written.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign these 3 lines? \"Amounts can be shown with or without the vendor's markup.\" | \"The ad may need 5, 10, 25 or 50 completed trades from you.\" | \"Our privacy tool hides names and account numbers in your proof; the trade code, amount and time stay visible.\"","n":"Shown on the BuyQuote and OfferAd screens under \"What affects you\": the buyer's lines (the first two for the taker only).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign these 3 lines? \"If our privacy tool hides the trade code, or there's no readable date, you're warned and can still post.\" | \"Once you tap \\\"I've paid\\\", neither of you can cancel.\" | \"After the time to pay, the trade stays open until the seller cancels: you can still message and pay. If you paid and they cancel, you can dispute at once.\"","n":"Shown on the BuyQuote and OfferAd screens under \"What affects you\": the buyer's lines.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign this line? \"Before \\\"I've paid\\\" goes through, a pop-up asks you to confirm. You can turn it off.\"","n":"Shown on the BuyQuote and OfferAd screens under \"What affects you\": the buyer's line about the confirm sheet.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"BuyQuote","q":"Sign these 3 lines? \"You escrow the trade plus 1% (the X2F fee); the buyer gets the full amount.\" | \"You receive the XMR less 1% (the X2F fee).\" | \"No fee on a full reversal; during an appeal the fee waits for the outcome.\"","n":"Shown on the OfferAd screen (the poster's view of a trade on their ad) under \"What affects you\": the fee lines, posters only (the owner: no \"poster pays 1%\" to the taker).","o":["Sign it as written","Change it xt three lines (owner G58: a strong login no longer throws the changes away). They replace batch 7's \"We tell the account owner straight away on every channel you set up, like push and secure Jabber...\", \"If you log in with a passkey... you see these changes waiting and can approve them now, make changes or cancel all changes.\" and \"Add a passkey, security key or PGP key and changes like these go through at once.\" \"Add one\" is on batch 7.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"HoldChange","q":"Sign these 3 lines? \"Submitted. Your changes take effect on 7 Nov 2026, 15:00 UTC.\" | \"Your list of changes was updated somewhere else. Check it again, then submit.\" | \"Could not submit your changes. Try again.\"","n":"Shown on the HoldChange screen after Submit, in this order: 1) success; 2) the list changed in another tab since it was reviewed; 3) failure.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"HoldChange","q":"Sign these 3 lines? \"Password\" / \"Your current password\" / \"A new password\" | \"Authenticator app\" / \"Your current setting\" / \"A new authenticator app\" | \"PGP key\" / \"Not on your account\" / \"A new PGP key\"","n":"Shown on the HoldChange screen: a change's row as title / Before / After (owner G29: what it looks like before and what the consequence is), never a secret or a full address. The board (batch 7) draws rows like \"Passkey on Pixel 8 · added 12 Jan 2026\" / \"Will be removed\".","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"HoldChange","q":"Sign these 3 lines? \"Passkey\" / \"Not on your account\" / \"A new passkey\" (or \"Security key\" / \"A new security key\") | \"Recovery code\" / \"Your current recovery code\" / \"A new recovery code\" | \"Login name\" / \"Your current login name\" / \"A new login name\"","n":"Shown on the HoldChange screen: more change rows (title / Before / After).","o":["Sign it as written"," hen a removal takes effect (owner p5-7: nothing early); 2) which device submitted it; 3) its tick's accessible label. The board (batch 7) has \"Applies after 24 h\" / \"Removed now · final in 23 h 12 min\".","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"HoldChange","q":"Sign these 3 lines? \"Untick a change to cancel it. A cancelled change never applies.\" | \"Cancel 1 unticked change\" / \"Cancel 2 unticked changes\" | \"Cancel this change?\" / \"Cancel all 4 changes?\"","n":"Shown on the HoldChange screen, in this order: 1) the help over the list (owner g65: untick to cancel one); 2) the button for the unticked ones; 3) the confirm question for one or for all (the board, batch 7, has \"Cancel these 4 changes?\"). \"Cancel all changes\", \"Cancel changes\" and \"Keep them\" are on batch 7.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"HoldChange","q":"Sign these 3 lines? \"A cancelled change never applies, so nothing on your account changes. We tell you on every device.\" | \"Cancelled. Nothing on your account changed.\" | \"Could not cancel that. Try again.\"","n":"Shown on the HoldChange screen, in this order: 1) the confirm sheet's body (the board has \"None of these changes will apply.\"); 2) the result; 3) the failure.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"HoldChange","q":"Sign these 3 lines? \"You logged in with a passkey, a security key or a PGP key, so you can approve these changes now and they apply at once. Any change you untick is cancelled.\" | \"Approve 4 changes now\" | \"Approved. Your changes have been applied.\" / \"Could not approve these changes. Try again.\"","n":"Shown on the HoldChange screen to a strong login during the wait (owner G58), in this order: 1) the note; 2) the button with its count (\"Approve now\" for one is on batch 7); 3) the result and the failure. The board (batch 7) has \"Submitted with just a username and password. Your login is strong, so you can decide now.\"","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"HoldChange","q":"Sign these 2 lines? \"Could not load your account changes.\" / \"No changes are waiting.\" | \"Continue\"","n":"Shown on the HoldChange screen: the load failure, the empty state, and the button on from the staged line.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"HoldMember","q":"Sign these 3 lines? \"A hold is on\" | \"satoshi_ghost's team is on a 24-hour hold. Some changes are waiting; they apply when it ends.\" | \"satoshi_ghost logs in with just a username and password, so team changes wait 24 h, even when a member with a stronger login makes them.\"","n":"Shown on the HoldMember screen (a team member's view while the lead's changes wait; owner p4-8), in this order: 1) title; 2) hero; 3) why. The HoldMember board's draft copy; not on pages 1 to 9.","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"HoldMember","q":"Sign these 3 lines? \"Ends in\" / \"You can keep trading as usual.\" | \"What you can see: that a hold is on. Ask satoshi_ghost if you need to know more.\" | \"You can see these changes but not change them.\" / \"You can untick a change so it won't apply, or cancel all of them.\"","n":"Shown on the HoldMember screen, in this order: 1) the countdown label and the trading line; 2) the line for a member with no hold rights; 3) the lines for a member who may see, or untick and cancel (the rights are on batch 8, MemberPermissions).","o":["Sign it as written","Change it (write the new words below)"],"r":0},{"s":"HoldMember","q":"Sign these 3 lines? \"Submitted by satoshi_ghost · username and password\" | \"Needs your passkey, security key or PGP key. Ending the hold applies every ticked change now.\" / \"End the hold\" | \"Hold ended. Every ticked change applied just now. The team is back to normal.\"","n":"Shown on the HoldMember screen, in this or
