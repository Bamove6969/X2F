<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>X2F Owner Follow-ups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Same shape as the question page: one explanation at a time, ink for the choice, orange for the recommendation. */
:root{--bg:#f6f6f3;--panel:#fff;--fg:#17181a;--muted:#5d6066;--line:#d9d9d3;--ink:#17181a;--on:#fff;--accent:#c2500a;--bad:#a3211b;--body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121315;--panel:#1b1d20;--fg:#f0f0ec;--muted:#a5a8ad;--line:#33363b;--ink:#f0f0ec;--on:#121315;--accent:#ff9a57;--bad:#ff8f87;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121315;--panel:#1b1d20;--fg:#f0f0ec;--muted:#a5a8ad;--line:#33363b;--ink:#f0f0ec;--on:#121315;--accent:#ff9a57;--bad:#ff8f87;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
h1{font-size:18px;margin:0}.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ink)}
.save{font-size:13px;color:var(--muted);min-height:20px}.save.bad{color:var(--bad)}
main{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tag{font-size:13px;color:var(--muted)}h2{font-size:21px;line-height:1.3;margin:0;text-wrap:balance}
.note{margin:0;white-space:pre-line}
.opt{display:flex;gap:10px;text-align:left;width:100%;background:none;color:inherit;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:8px}
.opt[aria-checked=true]{background:var(--ink);color:var(--on);border-color:var(--ink)}.opt[aria-checked=true] .rec{color:var(--on)}
.rec{color:var(--accent);font-weight:600;white-space:nowrap}
label{font-weight:600}textarea{width:100%;min-height:100px;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:8px}.btn{border:1.5px solid var(--line);background:none;color:inherit;font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--on);border-color:var(--ink)}.btn:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap">
<div class="top"><h1>X2F follow-ups</h1><span class="count" id="count"></span></div>
<div class="bar"><i id="bar"></i></div>
<div class="save" id="save" role="status">Loading your saved answers…</div>
<main id="card"></main>
</div>
<script>
const Q=[
{s:'Offers',q:'How far from market may a vendor price an offer?',n:'This is your Q3. Say XMR is $200.\n\nThe margin is how far above or below market a vendor sets the offer. At +10% they sell at $220.\n\nThe method extra is an added % for one payment type, because some cost more to handle. A vendor might add +5% for gift cards: $230.\n\nThe design screen allows margin ±10% and method extra -5% to +10%. The server allows ±50% and ±20%. They should match. Tight limits stop silly prices. Wide limits suit gift cards and high-inflation currencies.\n\nHaveno\'s default limit is 30% from market.',o:['Margin ±10%, method extra ±10%, combined cap about ±20%','Wider: margin ±30%, method extra ±20%','Keep the server\'s ±50% and ±20%'],r:0},
{s:'Offers',q:'What does a vendor write as payment instructions?',n:'This is your Q2. Today a vendor can write instructions per payment type, shown once a trade starts. You suggested automatic text instead, with the two people sorting details out in chat. With your answer that instructions change with the payment type picked, these are the choices.',o:['Vendor may write instructions per payment type; if blank, the automatic line shows: "Payment method chosen: Interac e-Transfer. Please post pertinent details in chat window."','Automatic line only, no vendor instructions'],r:0},
{s:'Offers',q:'What should a second amount band have to justify it?',n:'This is your Q20. You said an extra band needs a reason, like asking for 1,000 trades on bigger amounts. The cleanest version: each band has its own minimum past trades, and a band must differ from the others on that or on its ± %.',o:['A band must differ in minimum trades or ± %','Any band allowed, up to 3'],r:0},
{s:'Offers',q:'"My offers" is the vendor\'s list of their own ads. Should an ad there be flagged when one of its currencies has no market price?',n:'This is your Q26 and Q29. My offers is the screen where a vendor sees and manages their own listed ads. You suggested it might be called My Listings. If one currency has no price right now, buyers can\'t trade in it, so the vendor should know why.',o:['Yes, show a small flag on that ad','No flag'],r:0},
{s:'Offers',q:'Should the screen be called "My offers" or "My listings"?',o:['My offers','My listings'],r:0,n:'Everywhere else we call them offers, so keeping the word avoids two names for one thing.'},
{s:'Offers',q:'Should My offers show the name of every payment type on an ad?',n:'This is also your Q29. It would list every payment type on each ad row, instead of "3 methods".',o:['Yes, show every name','Show a count only'],r:0},
{s:'Offers',q:'Should the line "Each offer can cover several currencies." stay off the screen until that feature ships?',n:'This is your Q33. Task 34 is the multi-currency offers work: one ad covering up to 5 currencies. It isn\'t in main yet, so the line would be untrue today.',o:['Yes, hide it until it\'s true','Show it now'],r:0},
{s:'Offers',q:'Should the offer limit say "3" as a fixed number for now?',n:'This is your Q32. The limit is 3 buy and 3 sell offers. It will be a setting you can change on your owner settings page. That page doesn\'t exist yet, so the screens say "3" in plain text. If you later change the setting, those words would need updating unless we connect them.',o:['Yes, fixed "3" until your settings page exists','Connect it to the setting now'],r:0},
{s:'Trades',q:'How long does each payment type get?',n:'Your Q11. What actually happens, from research:\n\nInstant (Zelle, Interac, SEPA Instant, PayPal, Cash App, Venmo, Revolut, PIX, UPI, gift cards): seconds to minutes.\nSame or next day (SEPA standard, domestic wire, Wise): a weekday wire usually lands the same day. 24 h is near the worst normal case, and a Friday wire can land Monday.\nDays (ACH, international wire, cash by mail): 1 to 5 business days. Cash by mail needs up to 4 days.\n\nToday 101 of 109 payment types use a 24 h default, so instant payments wait as long as wires, and 24 h is the most the code allows.',o:['Three groups: instant keeps your 60 minutes; same or next day 24 h; days 48 h to 4 days, and raise the 24 h maximum','One time for everything'],r:0},
{s:'Trades',q:'How often can someone use the nudge?',n:'From your Q36. The nudge pokes the other person to get their attention while they wait.',o:['Once every 15 minutes','Once every 5 minutes','Once every 30 minutes'],r:0},
{s:'Prices',q:'Where should X2F get prices?',n:'Your Q6. LocalMonero used CoinGecko alone by default, and vendors could write formulas from 13 markets. Haveno and Bisq run their own price servers over Tor, asking many exchanges every minute and averaging after throwing out outliers. Binance and OKX dropped XMR in 2024, and Kraken stopped XMR trading in Europe, so depending on one source is risky.\n\nX2F plans to take the middle value of 3 sources, Kraken, Bitfinex and CoinGecko, and convert currencies through the US dollar.',o:['Keep the 3-source middle value, and add a 4th source after it passes a Tor check','3 sources only'],r:0},
{s:'Prices',q:'Why 45 currencies, and do we go past it?',n:'Your Q9. 45 was never a decision. It\'s CoinGecko\'s currency list minus one dead code. Going further means using exchange-rate sources that cover more currencies, plus a sanctions check, which should also cover RUB, already in the 45. You said you want as many as possible.',o:['Launch with the 45, then add what Coinbase and BitPay both quote, minus sanctioned currencies','Expand before launch, which delays the price work'],r:0},
{s:'Gift cards',q:'What are the gift card rules?',n:'Your Q22. From the research: Paxful and similar sites had the most gift card trades and the most fraud. Stolen cards get reported, and the issuer can freeze the card or the receiver\'s whole account. Paxful used evidence rules: receipt, a photo of the card with the trade code, and a screen recording of redeeming it. The full notes are in the research file.',o:['Keep gift cards: card currency follows its country, a short 2 h window, an evidence checklist in disputes, and tick-box terms for vendors','Launch without gift cards'],r:0},
{s:'Proof',q:'Should the person paying be warned if their blur hides the trade code?',n:'Your Q44, reworded. "Buyer" here means whoever is buying XMR, so the person sending the money, whether or not they posted the ad. Their proof is a payment screenshot. The trade code is the short code that ties the payment to this trade. If they blur it, the person receiving the money can\'t easily match the screenshot to the trade.',o:['Yes, warn them, and they can still post','No warning'],r:0},
{s:'Proof',q:'If the last digits of a card happen to match the trade amount, can they stay visible?',n:'Your Q48, reworded. Screenshots often show "card ending 1234". If the trade amount is also 1,234, the blur tool can\'t tell which is which. The last 4 digits alone aren\'t a full card number, so the choice is about being tidy.',o:['Leave it visible: last 4 digits are harmless','Blur it, even if that blurs the amount on rare trades'],r:0},
{s:'Reputation',q:'When someone\'s signature claim fails, do we show the 4-point help each time?',n:'Your Q66. Traders can bring over their reputation from other sites by signing a message with their PGP key. Failures usually come from one of 4 things: wrong key format, the computer\'s clock, encrypting when they should sign, or old software. The help lists those.',o:['Show it after every failed claim','Show it only on the first failure'],r:0},
{s:'Reputation',q:'What is the hard cap on an imported amount?',n:'Your Q58. You wrote "100,000+". This caps what a moderator can enter for trades proved on another site, so a typo can\'t show a giant number. You also asked for traded amounts in XMR.',o:['100,000 US dollars, shown converted to XMR','100,000 XMR','Warn above 100,000, with no hard stop'],r:0},
{s:'Sessions',q:'If you change session length on the Devices screen, does it change just this login or your default?',n:'Your Q71. You pick how long a session lasts at each login. The Devices screen lets you change it while logged in. It can affect only the session you\'re in now, or also pre-fill your next login. You said nothing is pre-selected at login, so a default would change that.',o:['This session only','Also remember it as my default'],r:0},
{s:'Staff',q:'The owner\'s staff menu: when do you want to see it?',n:'Your Q62. The menu isn\'t on a live page yet, because the staff website is still being built as Task 16.',o:['Show me screenshots when Task 16 is ready','Hold Task 16 until I\'ve seen a design'],r:0},
];
Q.forEach((x,i)=>{x.id='f'+(i+1);x.n0=i+1});
let db=null,A={},pos=0,tm=null;const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const done=q=>{const a=A[q.id];return !!a&&(a.choice!=null||(a.own||'').trim()!=='')};
function status(t,b){const s=$('save');s.textContent=t;s.className='save'+(b?' bad':'')}
function draft(s){try{if(s)localStorage.setItem('x2f-fu',JSON.stringify(A));else return JSON.parse(localStorage.getItem('x2f-fu')||'{}')}catch(e){}return {}}
async function save(q){draft(1);if(!db){status('Saved on this device only. Tell the lead.',1);return}
 try{await db.doc('answers/'+q.id).set({n:q.n0,question:q.q,...A[q.id]});status('Saved. The lead can read this answer.')}catch(e){status('That answer did not save. Try it again.',1)}}
function render(){const n=Q.filter(done).length;$('count').textContent=n+'/'+Q.length+' answered';$('bar').style.width=(n/Q.length*100)+'%';
 const c=$('card');c.replaceChildren();
 if(pos>=Q.length){c.append(el('h2',null,n===Q.length?'All answered':n+' of '+Q.length+' answered'),el('p','note','Tell the lead you\'re done.'));const b=el('button','btn','Back');b.onclick=()=>{pos=Q.length-1;render()};c.append(b);return}
 const q=Q[pos],cur=A[q.id];c.append(el('div','tag',q.s+' · '+(pos+1)+' of '+Q.length),el('h2',null,q.q));if(q.n)c.append(el('p','note',q.n));
 const o=el('div','opts');o.setAttribute('role','radiogroup');o.setAttribute('aria-label','Your answer');
 q.o.forEach((l,i)=>{const b=el('button','opt');b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(!!cur&&cur.choice===l));const t=el('span',null,l+' ');if(i===q.r)t.append(el('span','rec','(Recommended)'));b.append(t);
  b.onclick=()=>{A[q.id]={choice:l,own:'',at:new Date().toISOString()};save(q);render();clearTimeout(tm);tm=setTimeout(()=>{pos++;render()},350)};o.append(b)});c.append(o);
 const lb=el('label',null,'Or write your own answer');lb.htmlFor='own-'+q.id;const ta=el('textarea');ta.id='own-'+q.id;ta.placeholder='Type your full answer here';ta.value=cur&&cur.own||'';
 let t2=null;ta.oninput=()=>{clearTimeout(t2);status('Saving…');t2=setTimeout(()=>{A[q.id]={choice:null,own:ta.value,at:new Date().toISOString()};save(q);[...o.children].forEach(b=>b.setAttribute('aria-checked','false'))},600)};c.append(lb,ta);
 const nv=el('div','nav'),bk=el('button','btn','Back');bk.disabled=pos===0;bk.onclick=()=>{pos--;render()};const nx=el('button','btn pri',pos<Q.length-1?'Next':'Finish');nx.onclick=()=>{pos++;render()};nv.append(bk,nx);c.append(nv)}
A=draft();render();
(async()=>{db=window.claude?await claude.use('db').catch(()=>null):null;if(!db){status('Answers are saving on this device only. Tell the lead.',1);return}
 try{const s=await db.collection('answers').get();(s.docs||s).forEach(d=>{const v=d.data?d.data():d;if(d.id)A[d.id]={choice:v.choice??null,own:v.own||'',at:v.at}});status('Ready. Answers save as you tap.');const f=Q.findIndex(q=>!done(q));if(f>0)pos=f;render()}catch(e){status('Could not load saved answers. New answers will still save.',1)}})();
</script>

</body></html>
