<title>X2F Questions 7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Same shape as the question page: one explanation at a time, ink for the choice, orange for the recommendation. */
:root{--bg:#f6f6f3;--panel:#fff;--fg:#17181a;--muted:#5d6066;--line:#d9d9d3;--ink:#17181a;--on:#fff;--accent:#c2500a;--bad:#a3211b;--body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121315;--panel:#1b1d20;--fg:#f0f0ec;--muted:#a5a8ad;--line:#33363b;--ink:#f0f0ec;--on:#121315;--accent:#ff9a57;--bad:#ff8f87;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121315;--panel:#1b1d20;--fg:#f0f0ec;--muted:#a5a8ad;--line:#33363b;--ink:#f0f0ec;--on:#121315;--accent:#ff9a57;--bad:#ff8f87;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
h1{font-size:18px;margin:0}.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ink)}
.save{font-size:13px;color:var(--muted);min-height:20px}.save.bad{color:var(--bad)}
main{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tag{font-size:13px;color:var(--muted)}h2{font-size:21px;line-height:1.3;margin:0;text-wrap:balance}
.note{margin:0;white-space:pre-line}
.opt{display:flex;gap:10px;text-align:left;width:100%;background:none;color:inherit;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:8px}
.opt[aria-checked=true]{background:var(--ink);color:var(--on);border-color:var(--ink)}.opt[aria-checked=true] .rec{color:var(--on)}
.rec{color:var(--accent);font-weight:600;white-space:nowrap}
label{font-weight:600}textarea{width:100%;min-height:100px;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:8px}.btn{border:1.5px solid var(--line);background:none;color:inherit;font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--on);border-color:var(--ink)}.btn:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap">
<div class="top"><h1>X2F questions, page 7: team permissions</h1><span class="count" id="count"></span></div>
<div class="bar"><i id="bar"></i></div>
<div class="save" id="save" role="status">Loading your saved answers…</div>
<main id="card"></main>
</div>
<script>
const Q=[{"s": "Team permissions · TP1", "q": "Can a member release XMR to a buyer?", "n": "Releasing XMR is the one step that can't be undone: once it's sent, it's gone. Today the box exists, starts off, and shows a warning you must confirm before it turns on. Without it, a member can handle a trade right up to the end, but you have to do the release yourself.\nWhy design recommends A: if every release waits for your tap, a member who sells for you can't finish a trade while you're asleep, and the box becomes pointless. The warning plus the log, together with the per-member limit in TP4, keeps the risk in your hands.", "o": ["A. A member can release XMR once you tick the box and confirm the warning. Every release is written in your team activity log with the member's name and the amount.", "B. A member can get a trade ready to release, but the XMR only moves when you tap Approve on your own device, every time.", "C. Only you can ever release XMR. The box is taken off the members' screen."], "r": 0}, {"s": "Team permissions · TP2", "q": "Which boxes should ask for your confirmation before they turn on?", "n": "Some boxes are risky enough that ticking them brings up a warning you must agree to, so you can't switch them on by accident. Today only \"Release XMR\" does this. \"Confirm payment received\" is the step just before release: if a member confirms cash that never arrived, the XMR goes out for nothing. An older Team screen also called accepting trades and posting or editing offers risky.\nWhy design recommends A: these are the two steps that can lose you money with one tap. If too many boxes warn you, you stop reading the warnings.", "o": ["A. Two boxes ask first: \"Release XMR\" and \"Confirm payment received\". Nothing else does.", "B. Only \"Release XMR\" asks first, as drawn today.", "C. A longer list asks first: \"Release XMR\", \"Confirm payment received\", \"Accept a trade\", \"Post a new offer\" and every \"Edit\" box under Offers."], "r": 0}, {"s": "Team permissions · TP3", "q": "Can a member send your payment details to a buyer?", "n": "When your account is selling, someone has to tell the buyer where to send the cash: your bank, Zelle, e-Transfer address and so on. If a member types in the wrong details, or their own, the buyer's money goes somewhere else and you still owe the XMR. Today this is one box, off for new members.\nWhy design recommends A: switched payment details are the easiest way for a dishonest member to steal from you. A pick-list keeps the useful part and removes the danger.", "o": ["A. The box stays, off for new members. When it's on, the member can only send the details you've saved for each payment type, chosen from a list; they can't type new ones. Every send is in the team log with their name. (This adds a \"saved payment details\" list to your settings, which has to be designed and built.)", "B. The box stays as it is: once ticked, a member can type and send any payment details.", "C. Only you ever send payment details. Members can tell the buyer \"details coming\" but can't send them."], "r": 0}, {"s": "Team permissions · TP4", "q": "Should each member have a trade-size limit?", "n": "Right now a box is all or nothing: a member who can accept or release can do it for a trade of any size. A limit would let you say \"desk_ana may handle trades up to this size, nothing bigger.\" Above the limit, the trade waits for you.\nWhy design recommends A: it lets you trust a new member with small trades while keeping the big ones. XMR matches how the trade itself is counted, so the limit doesn't move when the price moves.", "o": ["A. Each member can have an optional limit in XMR that you set, such as 0.5 XMR. Up to that size, they can accept the trade, confirm payment and release (if those boxes are ticked); above it, those steps wait for you. With no limit set, there's no cap.", "B. The same, but you set the limit in US dollars, such as $500, worked out at the price when the trade starts.", "C. A daily total per member instead, such as 2 XMR a day across all their trades; after that, everything waits for you until the next day (UTC).", "D. No limits; boxes stay all or nothing, as today."], "r": 0}, {"s": "Team permissions · TP5", "q": "Can a member post a new offer or delete one?", "n": "A new offer is a public promise in your name, and it takes one of your 3 buy + 3 sell places. Deleting an offer removes it for good, along with its history. Today both are separate boxes, off for new members.\nWhy design recommends A: some vendors want a manager who runs the offers fully. With the name on every post and deletion, you can always see who did what.", "o": ["A. Both stay as separate boxes, off for new members. Anything a member posts or deletes shows \"Posted by desk_ana\" or \"Deleted by desk_ana\" in your offers list and in the team log.", "B. Members can be allowed to post, but deleting stays yours only. A member can at most pause an offer (with the \"Turn offers on or off\" box).", "C. Only you post or delete offers. Members can at most pause them and edit them, if ticked."], "r": 0}, {"s": "Team permissions · TP6", "q": "Can a member block a trader?", "n": "A block stops a trader from taking your offers or messaging you. It's quiet: if a member blocks a good customer, you may never notice that customer is gone. But members are often the first to meet a rude or abusive trader.\nWhy design recommends A: the member can stop abuse at once, and you can see and undo any block you disagree with.", "o": ["A. It stays a box, off for new members. Every block a member makes appears in your team log with an Undo button you can tap once to reverse it.", "B. Only you can block. A member can mark a trader \"Ask the lead to block\", and you decide.", "C. Every member can block, on from the start, with no log entry."], "r": 0}, {"s": "Team permissions · TP7", "q": "Can a member speak for you in a dispute?", "n": "When a trade goes to a dispute, a moderator reads both sides and decides who gets the money, so what is written in the dispute room matters. In the default set (TP12), a new member can open a dispute and answer the moderator. The partner and the moderator only see \"Team member\", never the member's name.\nWhy design recommends A: the member who handled the trade knows what happened. Making a dispute wait for you slows the ruling, and the clock keeps running.", "o": ["A. A new member can open a dispute and answer the moderator. You can read every word in the dispute room and write there yourself at any time.", "B. A member can open a dispute, but only you answer the moderator.", "C. Only you open and answer disputes. Members can only tell you a trade needs one."], "r": 0}, {"s": "Team permissions · TP8", "q": "Can a member read your private notes on traders?", "n": "You can keep private notes on traders, such as \"paid late twice\" or \"trusted, regular\". They could help a member spot a known problem. But they are your own words about people.\nWhy design recommends A: it lets you share a warning with someone you trust, without anyone else writing in your notes.", "o": ["A. It stays a box, off for new members, renamed \"See your notes on traders\". Members with it can read your notes, but not change or add to them.", "B. Members with the box can read your notes and add their own, marked with their name.", "C. Never. Your notes are only ever yours, and the box is removed."], "r": 0}, {"s": "Team permissions · TP9", "q": "What login does a member need to end a 24-hour hold early?", "n": "You decided members can be given \"End a hold\", which applies all waiting changes at once. The hold exists to give you 24 hours to notice a thief, so ending it removes that safety time. A member can never use a stronger login than yours.\nWhy design recommends A: if a thief has stolen a member's password, the thief could otherwise wipe out your 24 hours. Asking for a strong login at that moment closes the gap.", "o": ["A. \"End a hold\" only works when the member confirms with a passkey or security key at that moment. If they're logged in with just a username and password, the button won't work. And if you only use a username and password yourself, no member can end a hold.", "B. It works from whatever login the member is using, including just a username and password."], "r": 0}, {"s": "Team permissions · TP10", "q": "When do you approve a member's login?", "n": "When a member first uses their invite link, you get a request and must approve them before they get in. This is the moment a stolen invite link gets caught. Today it happens only once, the very first time.\nWhy design recommends A: one tap from you is a small cost. A member's login being used on an unknown device is exactly how an account gets emptied.", "o": ["A. You approve every member's first login, and also their first login on each new device.", "B. You approve only the very first login. New devices after that need no approval from you, as drawn today.", "C. You approve the first login. After that, new devices need your approval only for members who have \"Release XMR\" ticked."], "r": 0}, {"s": "Team permissions · TP11", "q": "Can you set working hours for a member?", "n": "Staff already have an on/off switch plus the days and hours they may work. Members have only the on/off switch. Working hours would mean a member can't log in or do anything outside the times you set.\nWhy design recommends A: it's the same setting already designed for staff, so it costs little. And a member's login used at 3 a.m. outside their hours simply doesn't work.", "o": ["A. Each member gets the same days-and-hours setting as staff, such as Monday to Friday, 08:00 to 18:00 UTC. Outside those hours they can't log in. New members start with \"any time\".", "B. Keep only the on/off switch you already have; no schedule."], "r": 0}, {"s": "Team permissions · TP12", "q": "What can a brand-new member do before you tick anything?", "n": "No starting set has been decided yet. Design suggests one rule: a new member can talk and look, but can't move money or change anything public until you tick it. That gives these 10 boxes on, and the other 24 off:\n1. Read trade chats\n2. Reply in trade chats\n3. Nudge the other trader\n4. See all offers\n5. Decline a trade\n6. Open a dispute\n7. Reply in a dispute\n8. See trade history\n9. See the team activity log\n10. See reviews\nOff at the start: sending payment details, uploading proof, your notes on traders, blocking, every offer change (pausing, prices, amounts, payment types, currencies, posting, deleting), accepting, marking paid, confirming payment received, releasing, cancelling, leaving feedback, exporting history, payout amounts, replying to reviews and support tickets. The three hold boxes stay off, as you already decided.\nWhy design recommends A: a new member can do the everyday job of answering customers from day one. Nothing they can do on day one costs you money or changes what the public sees.", "o": ["A. Use the 10 above as the starting set for every new member.", "B. A stricter start, with 5 on: read chats, reply in chats, nudge, see all offers, see reviews.", "C. Nothing on. You tick every box yourself for each new member.", "D. The 10 above plus \"Accept a trade\", so a new member can take trade requests but still can't confirm payment or release."], "r": 0}];
Q.forEach((x,i)=>{x.id='p7-'+(i+1);x.n0=i+1});
let db=null,A={},pos=0,tm=null;const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const done=q=>{const a=A[q.id];return !!a&&(a.choice!=null||(a.own||'').trim()!=='')};
function status(t,b){const s=$('save');s.textContent=t;s.className='save'+(b?' bad':'')}
function draft(s){try{if(s)localStorage.setItem('x2f-q7',JSON.stringify(A));else return JSON.parse(localStorage.getItem('x2f-q7')||'{}')}catch(e){}return {}}
async function save(q){draft(1);if(!db){status('Saved on this device only. Tell the lead.',1);return}
 try{await db.doc('answers/'+q.id).set({n:q.n0,question:q.q,...A[q.id]});status('Saved. The lead can read this answer.')}catch(e){status('That answer did not save. Try it again.',1)}}
function render(){const n=Q.filter(done).length;$('count').textContent=n+'/'+Q.length+' answered';$('bar').style.width=(n/Q.length*100)+'%';
 const c=$('card');c.replaceChildren();
 if(pos>=Q.length){c.append(el('h2',null,n===Q.length?'All answered':n+' of '+Q.length+' answered'),el('p','note','Tell the lead you\'re done.'));const b=el('button','btn','Back');b.onclick=()=>{pos=Q.length-1;render()};c.append(b);return}
 const q=Q[pos],cur=A[q.id];c.append(el('div','tag',q.s+' · '+(pos+1)+' of '+Q.length),el('h2',null,q.q));if(q.n)c.append(el('p','note',q.n));
 const o=el('div','opts');o.setAttribute('role','radiogroup');o.setAttribute('aria-label','Your answer');
 q.o.forEach((l,i)=>{const b=el('button','opt');b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(!!cur&&cur.choice===l));const t=el('span',null,l+' ');if(i===q.r)t.append(el('span','rec','(Recommended)'));b.append(t);
  b.onclick=()=>{A[q.id]={choice:l,own:'',at:new Date().toISOString()};save(q);render();clearTimeout(tm);tm=setTimeout(()=>{pos++;render()},350)};o.append(b)});c.append(o);
 const lb=el('label',null,'Or write your own answer');lb.htmlFor='own-'+q.id;const ta=el('textarea');ta.id='own-'+q.id;ta.placeholder='Type your full answer here';ta.value=cur&&cur.own||'';
 let t2=null;ta.oninput=()=>{clearTimeout(t2);status('Saving…');t2=setTimeout(()=>{A[q.id]={choice:null,own:ta.value,at:new Date().toISOString()};save(q);[...o.children].forEach(b=>b.setAttribute('aria-checked','false'))},600)};c.append(lb,ta);
 const nv=el('div','nav'),bk=el('button','btn','Back');bk.disabled=pos===0;bk.onclick=()=>{pos--;render()};const nx=el('button','btn pri',pos<Q.length-1?'Next':'Finish');nx.onclick=()=>{pos++;render()};nv.append(bk,nx);c.append(nv)}
A=draft();render();
(async()=>{db=window.claude?await claude.use('db').catch(()=>null):null;if(!db){status('Answers are saving on this device only. Tell the lead.',1);return}
 try{const s=await db.collection('answers').get();(s.docs||s).forEach(d=>{const v=d.data?d.data():d;if(d.id)A[d.id]={choice:v.choice??null,own:v.own||'',at:v.at}});status('Ready. Answers save as you tap.');const f=Q.findIndex(q=>!done(q));if(f>0)pos=f;render()}catch(e){status('Could not load saved answers. New answers will still save.',1)}})();
</script>
