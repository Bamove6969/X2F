<title>X2F Remaining Questions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Same shape as the question page: one explanation at a time, ink for the choice, orange for the recommendation. */
:root{--bg:#f6f6f3;--panel:#fff;--fg:#17181a;--muted:#5d6066;--line:#d9d9d3;--ink:#17181a;--on:#fff;--accent:#c2500a;--bad:#a3211b;--body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121315;--panel:#1b1d20;--fg:#f0f0ec;--muted:#a5a8ad;--line:#33363b;--ink:#f0f0ec;--on:#121315;--accent:#ff9a57;--bad:#ff8f87;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121315;--panel:#1b1d20;--fg:#f0f0ec;--muted:#a5a8ad;--line:#33363b;--ink:#f0f0ec;--on:#121315;--accent:#ff9a57;--bad:#ff8f87;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
h1{font-size:18px;margin:0}.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ink)}
.save{font-size:13px;color:var(--muted);min-height:20px}.save.bad{color:var(--bad)}
main{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tag{font-size:13px;color:var(--muted)}h2{font-size:21px;line-height:1.3;margin:0;text-wrap:balance}
.note{margin:0;white-space:pre-line}
.opt{display:flex;gap:10px;text-align:left;width:100%;background:none;color:inherit;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:8px}
.opt[aria-checked=true]{background:var(--ink);color:var(--on);border-color:var(--ink)}.opt[aria-checked=true] .rec{color:var(--on)}
.rec{color:var(--accent);font-weight:600;white-space:nowrap}
label{font-weight:600}textarea{width:100%;min-height:100px;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:8px}.btn{border:1.5px solid var(--line);background:none;color:inherit;font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--on);border-color:var(--ink)}.btn:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap">

<script>
const Q=[{"s": "Sign these", "q": "Sign this wording for the screen after \"I've paid\"?", "n": "\"When they release, 1.250000 XMR goes to your wallet once your app co-signs. Keep this page open until it arrives.\"\n\nThe old line said the app co-signs by itself, which is untrue: the page has to stay open.", "o": ["Signed", "Reject it"], "r": 0}, {"s": "Sign these", "q": "Sign this wording for the refund screen?", "n": "\"Open a dispute and add your payment proof. If the money reached satoshi_ghost, a moderator can rule that they owe you the 1.250000 XMR. Until they pay it back, they can't trade.\"\n\nThe old line promised a moderator \"makes them\" pay, which we can't do.", "o": ["Signed", "Reject it"], "r": 0}, {"s": "Staff", "q": "Must every moderator hold all three: security key, PGP key and passkey?", "n": "You said a moderator has a minimum of all three, and a new device needs two of the three. Today the code lets a moderator join without a passkey, and refuses security key plus passkey as a pair.", "o": ["All three required, and any two log in on a new device", "Keep today's stricter pairs: PGP must be one of the two"], "r": 0}, {"s": "Staff", "q": "Should permanently removing a staff member, or an owner key, need a security key tap?", "n": "Today a logged-in owner session is enough. A stolen session could remove every staff member for good.", "o": ["Yes, require a tap", "No, a session is enough"], "r": 0}, {"s": "Holds", "q": "Should removing a wallet or team member also wait 24 hours when done with only a username and password?", "n": "Today adding waits 24 hours, but removing is instant. A thief could delete your wallets and team now, then queue their own wallet, so it becomes your only wallet after 24 hours.", "o": ["Yes, removals wait 24 hours too", "Keep removals instant"], "r": 0}, {"s": "Holds", "q": "PGP login uses the key with no username. Is that fine?", "n": "You said a strong login is username and PGP. Today the PGP login takes only the key: whoever can answer the key's challenge gets in, which already proves they hold the private key. Adding a username means one more thing a person must type, and a private login name stays private.", "o": ["Add the username: username and PGP", "Key alone is fine"], "r": 0}, {"s": "Holds", "q": "During someone's account hold, can their trade partner still open a dispute?", "n": "A paused trade currently refuses disputes, so a partner who has paid can't reach a moderator. I've told claude2 to allow it for now, because a person who has paid must always be able to reach a moderator.", "o": ["Yes, always allow a dispute", "No, wait for the hold to end"], "r": 0}, {"s": "Sessions", "q": "Can an account in a 24-hour hold still extend its session?", "o": ["Yes", "No"], "r": 0, "n": "Extending needs a login method, and the hold doesn't stop it today."}, {"s": "Sessions", "q": "Should extending a session send an alert?", "o": ["No alert", "Yes, alert on every extend"], "r": 0, "n": "Extends happen a lot, so alerts would become noise."}, {"s": "Sessions", "q": "Is one login method enough to extend a session?", "n": "A team member's login needs two methods, but extending needs one. A password-only account extends with the password alone.", "o": ["One is enough", "Require the same as login"], "r": 0}, {"s": "Vendors", "q": "Should a vendor get a warning before the 60-day auto-close?", "n": "Today it closes with no warning.", "o": ["Yes: warnings at 45 and 55 days", "No warning"], "r": 0}, {"s": "Vendors", "q": "Can staff reopen an account that auto-closed?", "n": "Today nothing can reopen it, even a mistake after an outage.", "o": ["Yes, senior moderators and the owner", "No, never"], "r": 0}, {"s": "Vendors", "q": "Can a vendor remove its only strong login key after switching?", "n": "Becoming a vendor needs a passkey, security key or PGP, but it could then be removed, leaving a password-only vendor.", "o": ["No, a vendor always keeps one", "Yes"], "r": 0}, {"s": "Vendors", "q": "May someone whose account auto-closed reuse their key or names on a new account?", "o": ["No: new key and new names", "Yes, after 60 days more"], "r": 0, "n": "You said they open a new account. Today names and PGP keys stay taken forever."}, {"s": "Offers", "q": "What can make one amount band different from another?", "n": "You said bands must differ, but the list of what can differ isn't settled. Options can be mixed.", "o": ["Minimum past trades and the \u00b1 %, and the amounts can't overlap", "Also allow different payment types per band"], "r": 0}, {"s": "Proof pictures \u00b7 old Q45", "q": "If no date can be read on the screenshot, what happens?", "o": ["No pop-up (built)", "Ask the buyer to confirm the payment date"], "r": 0}, {"s": "Proof pictures \u00b7 old Q49", "q": "Review notes allow numbers up to about 9 digits, which lets through some phone and short account numbers. A later answer refuses all personal details. Which rule wins?", "o": ["Refuse anything shaped like a phone or account number; allow plain amounts", "Keep allowing up to 9 digits"], "r": 0}, {"s": "Staff tools \u00b7 old Q53", "q": "How long do we keep records of staff security-key taps?", "o": ["Delete unused after 24 h; keep used ones 90 days, like the ruling record", "Other periods"], "r": 0}, {"s": "Staff tools \u00b7 old Q57", "q": "Maintenance notices default to \"emergency\" with up to 500 characters, and dispute timers pause. Keep that?", "o": ["Keep as built", "Change it (say how below)"], "r": 0}, {"s": "Staff tools \u00b7 old Q61", "q": "The staff feedback list shows senders only as \"Named\" or \"Anonymous\". Should named feedback show the account?", "o": ["Show the account name", "Keep as built"], "r": 0}, {"s": "Reviews and reputation \u00b7 old Q65", "q": "If one account's claim on a PGP key is revoked, may a different account then claim that key?", "o": ["No (built)", "Yes, after a moderator checks it"], "r": 0}, {"s": "Feedback form \u00b7 old Q68", "q": "Someone who sends twice within 30 seconds sees \"Too many tries. Try again in 1 minute.\" Change it?", "o": ["Use the proposed wording", "Leave it as today"], "r": 0}, {"s": "Sessions and accounts \u00b7 old Q70", "q": "You said session length is a \"drop-down, nothing pre-selected\", but design drew four tiles. Which?", "o": ["Tiles, nothing pre-selected", "Drop-down"], "r": 0, "n": "Design recommends: Tiles, still with nothing pre-selected. This is a visual call, but it changes the owner's word, so we're asking."}, {"s": "Sessions and accounts \u00b7 old Q72", "q": "If someone picks a longer session partway through, when does it apply?", "o": ["From the next confirm (built)", "At once, which would need a proof"], "r": 0}, {"s": "Sessions and accounts \u00b7 old Q74", "q": "Should signup ask for the session length too?", "o": ["No", "Yes"], "r": 0}, {"s": "Sessions and accounts \u00b7 old Q76", "q": "Do vendors need anything beyond a passkey, security key or PGP key, like a number of completed trades?", "o": ["A key only (built)", "Add a requirement"], "r": 0}, {"s": "Sessions and accounts \u00b7 old Q80", "q": "Should banning a vendor also ban its team members' entries?", "o": ["No (built)", "Yes"], "r": 0}, {"s": "Account holds \u00b7 old Q82", "q": "Which changes queue for 24 h?", "o": ["All of them (built)", "Only login methods, wallets and team"], "r": 0}, {"s": "Account holds \u00b7 old Q83", "q": "Does a later change restart the 24 h for everything waiting?", "o": ["Yes, one date for all (built)", "Each change keeps its own 24 h"], "r": 0}, {"s": "Account holds \u00b7 old Q84", "q": "Do submitted changes survive if the session that made them is revoked?", "o": ["Yes; drafts do not (built)", "No, they die with the session"], "r": 0}, {"s": "Account holds \u00b7 old Q85", "q": "Can team members see or cancel the lead account's waiting changes?", "o": ["No (built)", "Yes"], "r": 0}, {"s": "Account holds \u00b7 old Q86", "q": "Does a recovery-code login discard waiting password-only changes?", "o": ["Yes (built)", "No"], "r": 0}, {"s": "Account holds \u00b7 old Q87", "q": "During a hold, may the trade partner still leave the trade?", "o": ["Yes (built)", "No"], "r": 0}, {"s": "Account holds \u00b7 old Q88", "q": "Password plus authenticator on a new device with only weak sessions open still gets in. Keep that?", "o": ["Keep (built)", "Require a passkey, key or PGP here too"], "r": 0}, {"s": "Account holds \u00b7 old Q89", "q": "When a moderator ends or extends a hold, should that leave an audit record?", "o": ["Add an audit record", "Alerts only (built)"], "r": 0}, {"s": "Account holds \u00b7 old Q90", "q": "Is 20 waiting changes per account the right cap?", "o": ["Keep as built", "Change it (say how below)"], "r": 0}, {"s": "Looks and wording \u00b7 old Q91", "q": "What does an incident ID look like, and who sees the incident pop-up?", "o": ["Short code like INC-7Q4K; partners only", "Short code; partners and the held account", "Date-based code; partners only"], "r": 0, "n": "Design recommends: The short code; partners only. The held account already gets the hold notice."}, {"s": "Looks and wording \u00b7 old Q92", "q": "What is the middle choice for badge visibility, between always showing and hiding?", "o": ["Drop the middle option", "\"On tap\"", "\"On hover\""], "r": 0, "n": "Design recommends: Drop it. Hover and tap behave differently, and two choices are clearer."}, {"s": "Looks and wording \u00b7 old Q94", "q": "Ban-Notice draft wording: \"Message a moderator on Matrix\", a new headline and an \"Account banned\" chip. Sign it?", "o": ["Sign it off", "Reject it"], "r": 0}, {"s": "Looks and wording \u00b7 old Q95", "q": "What colour should a link turn when the pointer is over it?", "o": ["The dark ink colour", "Orange"], "r": 0}, {"s": "Looks and wording \u00b7 old Q96", "q": "What colour should \"XMR\" be next to an amount?", "o": ["Orange until design decides", "Ink"], "r": 0}, {"s": "Looks and wording \u00b7 old Q97", "q": "Should the active Buy/Sell tab have a 2-pixel dark border?", "o": ["Yes", "No"], "r": 0}, {"s": "Looks and wording \u00b7 old Q98", "q": "Keep the new disabled-button and sheet-title look everywhere in the app?", "o": ["Yes", "No"], "r": 0}, {"s": "Looks and wording \u00b7 old Q99", "q": "Some board items aren't built on the offers screens: market price card, per-method icons, section counts, Site news link, Deposit row, empty-search heading. Build them?", "o": ["Yes, design decides the order", "No"], "r": 0}, {"s": "Looks and wording \u00b7 old Q100", "q": "Should design confirm two new looks: the blue \"information\" note, and rounder corners on icon buttons?", "o": ["Yes", "No"], "r": 0}, {"s": "Looks and wording \u00b7 old Q101", "q": "The Devices screen needs wording for five things, such as the empty team card and \"2 of 1 devices\". Who writes it?", "o": ["Design writes them", "I'll write them"], "r": 0}, {"s": "Looks and wording \u00b7 old Q102", "q": "Is it fine that a folding phone opened flat has no Back button, as on the board?", "o": ["Yes", "No"], "r": 0}, {"s": "Looks and wording \u00b7 old Q103", "q": "Should the fold screen's payment label change to the 6 Nov board's \"Pay now\"?", "o": ["Wait until the fold boards are final", "Change it now"], "r": 0}, {"s": "Looks and wording \u00b7 old Q93", "q": "What are X2F's real Matrix and Telegram addresses?", "o": [], "n": "Design recommends: None. We need the real ones before launch."}, {"s": "Gift cards", "q": "How long does the buyer get to redeem a gift card code?", "n": "Design's draft gift card rules need your numbers. The code must be checked while both people are online.", "o": ["30 minutes", "1 hour", "15 minutes"], "r": 0}, {"s": "Gift cards", "q": "How old may a gift card be?", "n": "Older cards are more often stolen or already used.", "o": ["Bought within the last 7 days", "Within 30 days", "No limit"], "r": 0}, {"s": "Gift cards", "q": "Partial balances on gift cards?", "o": ["No partial balances: the full value only", "Allow them"], "r": 0}, {"s": "Gift cards", "q": "Which gift card brands are allowed?", "n": "Design proposes a brand list in docs/design-gift-card-rules-2026-11-07.md. Today the payment list has several.", "o": ["Use design's list", "I'll write the list below"], "r": 0}, {"s": "Reputation", "q": "Does the \"XMR traded to date\" line include imported volume from other sites?", "n": "Imported volume shows on its own line per site, as you asked.", "o": ["No, X2F trades only; imports stay on their own lines", "Yes, one total"], "r": 0}, {"s": "Nudge", "q": "Is the nudge sound right?", "n": "Design made an original double honk in the spirit of the old ICQ horn, so there's no rights problem. I've sent you the file.", "o": ["Sounds good", "Change it (say how below)"], "r": 0}, {"s": "Disputes", "q": "After a buyer cancels, should the refund screen offer a dispute card?", "n": "The card asks \"Did you pay before you cancelled?\" The board shows it, but a 29 Oct decision hid it in the code. It helps a buyer who paid and then cancelled by mistake.", "o": ["Show it", "Keep it hidden"], "r": 0}, {"s": "Holds", "q": "Is logging out your devices a sensitive action, needing a strong login?", "o": ["Yes", "No, a username and password is enough"], "r": 1, "n": "If it's sensitive, a person with only a username and password can't kick others out. If a thief is logged in, you'd want to log them out fast, so I recommend no."}, {"s": "Holds", "q": "When a strong login ends a hold early, do queued changes get cancelled or approved?", "n": "The earlier rule said a strong login \"ends early and discards\". Design's boards have two readings, so please confirm.", "o": ["Cancelled: the queued changes are thrown out", "Approved: they apply at once"], "r": 0}, {"s": "Owner safety", "q": "If you lose every PGP key while logged out, how do you get back in?", "n": "Today you can't: the owner login needs a PGP key plus a security key, and there's no reset. A lost PGP key means locked out for good. Your answers also pull two ways: one says you log in with a security key or backup key, another says PGP plus a security key.", "o": ["Register a second PGP key at setup, kept offline, and stay with PGP plus security key", "Allow both security keys alone as a backup login", "Accept the risk: no recovery"], "r": 0}, {"s": "Staff", "q": "If a moderator loses their only security key, how do they recover?", "n": "Today they can't: every change needs a tap from that key. Only switching them off or removing them works.", "o": ["The owner can reset a member's keys, with a tap", "Remove them and invite again"], "r": 0}, {"s": "Team", "q": "Should holds stay off-limits to team members?", "n": "Design redrew team permissions: four types, 31 checkboxes. It recommends adding holds to the \"Never available to members\" list. The 31 labels are in design's notes for your sign-off.", "o": ["Yes, never available to members", "No"], "r": 0}, {"s": "Maintenance", "q": "Can we take the trade timer code off hold, apart from the watcher?", "n": "You said timers pause during maintenance, but the code that does this is part of the watcher work you put on hold. Without it, a seller could lose their time during maintenance, and a buyer locked out could miss their payment deadline. This only moves deadlines. It doesn't touch any coins.", "o": ["Yes, build the timer loop now and keep the watcher on hold", "No, keep it all on hold, and don't run maintenance until then"], "r": 0}, {"s": "Disputes", "q": "If a moderator refunds a cancelled trade, does the poster still pay the 1% fee?", "n": "The rule so far: cancels never pay the fee. But some cancels end up with a moderator, for example when a refund goes missing, and a refund ruling currently charges 1%.", "o": ["No fee on cancels, even if a moderator finishes them", "Charge the fee if a moderator is involved"], "r": 0}, {"s": "Holds", "q": "Removing a login method with only a username and password: wait 24 hours, or at once?", "n": "You said removing a wallet or team member takes effect at once and turns permanent after 24 hours. Login methods are different: a thief could remove yours and lock you out. Design recommends they wait the full 24 hours.", "o": ["Wait the full 24 hours", "Take effect at once, permanent after 24 hours"], "r": 0}, {"s": "Holds", "q": "If someone cancels during the 24 hours, do removed items come back?", "n": "For example, a wallet removed by mistake or by a thief.", "o": ["Yes, everything is restored", "No, removed items stay removed"], "r": 0}, {"s": "Trades", "q": "Does the seller's 90 minutes count from when the escrow is secured?", "o": ["Yes, from escrow secured", "From when the trade started"], "r": 0, "n": "This is the wait before a seller can cancel a trade when the buyer goes quiet."}, {"s": "Trades", "q": "Can the buyer cancel after escrow, but not after tapping \"I've paid\"?", "n": "Once they've said they paid, a cancel could undo a real payment.", "o": ["Yes: cancel until \"I've paid\", then only a dispute", "Allow a cancel after \"I've paid\" too"], "r": 0}];
Q.forEach((x,i)=>{x.id='g'+(i+1);x.n0=i+1});
let db=null,A={},pos=0,tm=null;const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const done=q=>{const a=A[q.id];return !!a&&(a.choice!=null||(a.own||'').trim()!=='')};
function status(t,b){const s=$('save');s.textContent=t;s.className='save'+(b?' bad':'')}
function draft(s){try{if(s)localStorage.setItem('x2f-rq',JSON.stringify(A));else return JSON.parse(localStorage.getItem('x2f-rq')||'{}')}catch(e){}return {}}
async function save(q){draft(1);if(!db){status('Saved on this device only. Tell the lead.',1);return}
 try{await db.doc('answers/'+q.id).set({n:q.n0,question:q.q,...A[q.id]});status('Saved. The lead can read this answer.')}catch(e){status('That answer did not save. Try it again.',1)}}
function render(){const n=Q.filter(done).length;$('count').textContent=n+'/'+Q.length+' answered';$('bar').style.width=(n/Q.length*100)+'%';
 const c=$('card');c.replaceChildren();
 if(pos>=Q.length){c.append(el('h2',null,n===Q.length?'All answered':n+' of '+Q.length+' answered'),el('p','note','Tell the lead you\'re done.'));const b=el('button','btn','Back');b.onclick=()=>{pos=Q.length-1;render()};c.append(b);return}
 const q=Q[pos],cur=A[q.id];c.append(el('div','tag',q.s+' · '+(pos+1)+' of '+Q.length),el('h2',null,q.q));if(q.n)c.append(el('p','note',q.n));
 const o=el('div','opts');o.setAttribute('role','radiogroup');o.setAttribute('aria-label','Your answer');
 q.o.forEach((l,i)=>{const b=el('button','opt');b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(!!cur&&cur.choice===l));const t=el('span',null,l+' ');if(i===q.r)t.append(el('span','rec','(Recommended)'));b.append(t);
  b.onclick=()=>{A[q.id]={choice:l,own:'',at:new Date().toISOString()};save(q);render();clearTimeout(tm);tm=setTimeout(()=>{pos++;render()},350)};o.append(b)});c.append(o);
 const lb=el('label',null,'Or write your own answer');lb.htmlFor='own-'+q.id;const ta=el('textarea');ta.id='own-'+q.id;ta.placeholder='Type your full answer here';ta.value=cur&&cur.own||'';
 let t2=null;ta.oninput=()=>{clearTimeout(t2);status('Saving…');t2=setTimeout(()=>{A[q.id]={choice:null,own:ta.value,at:new Date().toISOString()};save(q);[...o.children].forEach(b=>b.setAttribute('aria-checked','false'))},600)};c.append(lb,ta);
 const nv=el('div','nav'),bk=el('button','btn','Back');bk.disabled=pos===0;bk.onclick=()=>{pos--;render()};const nx=el('button','btn pri',pos<Q.length-1?'Next':'Finish');nx.onclick=()=>{pos++;render()};nv.append(bk,nx);c.append(nv)}
A=draft();render();
(async()=>{db=window.claude?await claude.use('db').catch(()=>null):null;if(!db){status('Answers are saving on this device only. Tell the lead.',1);return}
 try{const s=await db.collection('answers').get();(s.docs||s).forEach(d=>{const v=d.data?d.data():d;if(d.id)A[d.id]={choice:v.choice??null,own:v.own||'',at:v.at}});status('Ready. Answers save as you tap.');const f=Q.findIndex(q=>!done(q));if(f>0)pos=f;render()}catch(e){status('Could not load saved answers. New answers will still save.',1)}})();
