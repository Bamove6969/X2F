<title>X2F Questions 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Same shape as the question page: one explanation at a time, ink for the choice, orange for the recommendation. */
:root{--bg:#f6f6f3;--panel:#fff;--fg:#17181a;--muted:#5d6066;--line:#d9d9d3;--ink:#17181a;--on:#fff;--accent:#c2500a;--bad:#a3211b;--body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121315;--panel:#1b1d20;--fg:#f0f0ec;--muted:#a5a8ad;--line:#33363b;--ink:#f0f0ec;--on:#121315;--accent:#ff9a57;--bad:#ff8f87;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121315;--panel:#1b1d20;--fg:#f0f0ec;--muted:#a5a8ad;--line:#33363b;--ink:#f0f0ec;--on:#121315;--accent:#ff9a57;--bad:#ff8f87;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
h1{font-size:18px;margin:0}.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ink)}
.save{font-size:13px;color:var(--muted);min-height:20px}.save.bad{color:var(--bad)}
main{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tag{font-size:13px;color:var(--muted)}h2{font-size:21px;line-height:1.3;margin:0;text-wrap:balance}
.note{margin:0;white-space:pre-line}
.opt{display:flex;gap:10px;text-align:left;width:100%;background:none;color:inherit;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:8px}
.opt[aria-checked=true]{background:var(--ink);color:var(--on);border-color:var(--ink)}.opt[aria-checked=true] .rec{color:var(--on)}
.rec{color:var(--accent);font-weight:600;white-space:nowrap}
label{font-weight:600}textarea{width:100%;min-height:100px;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:8px}.btn{border:1.5px solid var(--line);background:none;color:inherit;font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--on);border-color:var(--ink)}.btn:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap">
<div class="top"><h1>X2F questions, page 4</h1><span class="count" id="count"></span></div>
<div class="bar"><i id="bar"></i></div>
<div class="save" id="save" role="status">Loading your saved answers…</div>
<main id="card"></main>
</div>
<script>
const Q=[{"s": "Reputation", "q": "How should volume imported from other sites show on an offer card?", "n": "Moderators verify your dollar volume from sites like LocalMonero. Today the card converts it to XMR at today's price.\nThe problem: someone who traded $100,000 when XMR was $250 actually moved about 400 XMR. At today's $150 the card would say \"650+ XMR on LocalMonero, verified\". That overstates their trading by 60%, under the word \"verified\", and the number moves every time the price does.", "o": ["Show dollars: \"$100,000+ on LocalMonero, verified\"", "Moderator records the real XMR amount from the proof", "Keep XMR at today's price, but say \"worth about\"", "Hide imported lines until we decide"], "r": 0}, {"s": "Times", "q": "Deadlines (the 48-hour dispute window, the seller's cancel time, the end of an account hold) now show in UTC only. Is that OK?", "n": "Example: someone in California sees \"15:00 UTC\" and has to work out that it means 7 a.m. their time. A missed dispute window can't be undone.", "o": ["Their own local time, with UTC in brackets", "Their own local time only", "UTC only, as now"], "r": 0}, {"s": "Gift cards", "q": "Here is the gift card brand list. Approve it, or change it?", "n": "In the app now: Amazon, Apple, Google Play, PlayStation, Xbox, Steam, Razer Gold, Walmart, Target, Sephora, Uber, Visa, Mastercard, and \"Other\".\n\"Other\" lets a trader name any brand, which is harder for moderators to check in a dispute. Visa and Mastercard prepaid cards are also the ones most often used in scams.", "o": ["Approve, but drop \"Other\"", "Approve the whole list as it is", "Approve, but drop \"Other\", Visa and Mastercard"], "r": 0}, {"s": "Owner safety", "q": "You said you'd get back in with one of your two backup security keys. Should one key be enough, or should both be needed together?", "n": "One key alone: if you lose one key you can still get in, but someone who steals one key can also get in.\nBoth together: a single stolen key gets nobody in, but if you lose one key, you can't recover until you replace it.\nThis is the account that controls the whole site.", "o": ["Both keys together", "Either key alone"], "r": 0}, {"s": "Accounts", "q": "A reminder about the 60-day auto-close, which you asked about. Which accounts should it apply to?", "n": "This is your rule from an earlier page (Q77): \"If they haven't logged into their account in 60 days, then it automatically closes.\" You also said someone who closes can reuse their keys on a new account, but not their username or display name.\nWe still need to know who the rule covers, and what happens if a trade or dispute is still open when the 60 days run out. We recommend pausing the clock while one is open, so nobody's money is stuck.", "o": ["Every account; an open trade or dispute pauses the clock", "Vendors only; an open trade or dispute pauses the clock", "Every account, with no pause", "Drop the rule"], "r": 0}, {"s": "Accounts", "q": "Should a vendor get any warning before the 60-day close?", "n": "X2F keeps no email address, so the only place to warn someone is inside the app, and they only see that if they log in. A logged-in vendor also resets the clock.\nOne option: show \"Your account closes in N days if you don't log in\" whenever a vendor logs in and has been away for 30 days or more. That only helps someone who already logs in.", "o": ["No warning: the 60-day rule is on the vendor page from day one", "Show the in-app notice when they log in after 30 days away", "Warn by Matrix or Telegram if they gave a handle"], "r": 0}, {"s": "Setup (needs you)", "q": "SonarQube Cloud, the GitHub code reviewer you wanted. Ready to switch it on?", "n": "The workflow is on main but stays off until you do these steps at sonarcloud.io, signed in with GitHub:\n1. Import the Bamove6969/X2F repository.\n2. Turn Automatic Analysis off (Administration → Analysis Method).\n3. Create a token and save it in GitHub as the repository secret SONAR_TOKEN.\n4. Add the repository variables SONAR_ORGANIZATION and SONAR_PROJECT_KEY, copied from SonarQube.\nNever paste the token to anyone, including me.", "o": ["I'll do it now and tell the lead", "Later", "Don't use SonarQube"], "r": 0}, {"s": "Holds", "q": "You asked what \"holds off-limits to team members\" means. Here it is: who may manage a waiting change?", "n": "Say a team leader with weak security makes a change, and it waits 24 hours. Everyone on the team is affected by that wait, as you said.\nThe question is who may act on it during those 24 hours: see the list of waiting changes, untick one, press \"Cancel all\", or end the hold early with a strong login.\nIf team members can cancel, a thief inside a team could cancel the real owner's fixes. If only the owner can, a team waits on one person.", "o": ["Only the account's main owner can see, cancel or end it; team members just see that a hold is on", "Team members can see the list but only the owner can cancel or end it", "Any team member can cancel or end it"], "r": 0}, {"s": "Watcher", "q": "A reminder of what the watcher is. Which version do you want?", "n": "The watcher is a small program on the moderation server. Every 15 seconds it asks a Monero node how many coins are in each open trade's escrow, and how confirmed they are. It can't move coins, since that always needs two of the three keys.\nIt's what makes these work: the buyer's clock starts when the coins really arrive; no-show refunds happen automatically; trades end when the seller never funds; and extra or late coins get flagged.\nThe phones can't be trusted alone, because either side could lie and both are often closed.\nIts code has been waiting on your answer, so the trade timer code is held too. You already ruled that maintenance freezes trade timers, but 24-hour account holds keep counting down.", "o": ["Always on, checking every 15 seconds (as built)", "Lighter: only checks at key moments (setup, deadlines, payout)", "Only when a phone reports a problem or a deadline passes", "No watcher: trust the phones"], "r": 0}];
Q.forEach((x,i)=>{x.id='p4-'+(i+1);x.n0=i+1});
let db=null,A={},pos=0,tm=null;const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const done=q=>{const a=A[q.id];return !!a&&(a.choice!=null||(a.own||'').trim()!=='')};
function status(t,b){const s=$('save');s.textContent=t;s.className='save'+(b?' bad':'')}
function draft(s){try{if(s)localStorage.setItem('x2f-q4',JSON.stringify(A));else return JSON.parse(localStorage.getItem('x2f-q4')||'{}')}catch(e){}return {}}
async function save(q){draft(1);if(!db){status('Saved on this device only. Tell the lead.',1);return}
 try{await db.doc('answers/'+q.id).set({n:q.n0,question:q.q,...A[q.id]});status('Saved. The lead can read this answer.')}catch(e){status('That answer did not save. Try it again.',1)}}
function render(){const n=Q.filter(done).length;$('count').textContent=n+'/'+Q.length+' answered';$('bar').style.width=(n/Q.length*100)+'%';
 const c=$('card');c.replaceChildren();
 if(pos>=Q.length){c.append(el('h2',null,n===Q.length?'All answered':n+' of '+Q.length+' answered'),el('p','note','Tell the lead you\'re done.'));const b=el('button','btn','Back');b.onclick=()=>{pos=Q.length-1;render()};c.append(b);return}
 const q=Q[pos],cur=A[q.id];c.append(el('div','tag',q.s+' · '+(pos+1)+' of '+Q.length),el('h2',null,q.q));if(q.n)c.append(el('p','note',q.n));
 const o=el('div','opts');o.setAttribute('role','radiogroup');o.setAttribute('aria-label','Your answer');
 q.o.forEach((l,i)=>{const b=el('button','opt');b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(!!cur&&cur.choice===l));const t=el('span',null,l+' ');if(i===q.r)t.append(el('span','rec','(Recommended)'));b.append(t);
  b.onclick=()=>{A[q.id]={choice:l,own:'',at:new Date().toISOString()};save(q);render();clearTimeout(tm);tm=setTimeout(()=>{pos++;render()},350)};o.append(b)});c.append(o);
 const lb=el('label',null,'Or write your own answer');lb.htmlFor='own-'+q.id;const ta=el('textarea');ta.id='own-'+q.id;ta.placeholder='Type your full answer here';ta.value=cur&&cur.own||'';
 let t2=null;ta.oninput=()=>{clearTimeout(t2);status('Saving…');t2=setTimeout(()=>{A[q.id]={choice:null,own:ta.value,at:new Date().toISOString()};save(q);[...o.children].forEach(b=>b.setAttribute('aria-checked','false'))},600)};c.append(lb,ta);
 const nv=el('div','nav'),bk=el('button','btn','Back');bk.disabled=pos===0;bk.onclick=()=>{pos--;render()};const nx=el('button','btn pri',pos<Q.length-1?'Next':'Finish');nx.onclick=()=>{pos++;render()};nv.append(bk,nx);c.append(nv)}
A=draft();render();
(async()=>{db=window.claude?await claude.use('db').catch(()=>null):null;if(!db){status('Answers are saving on this device only. Tell the lead.',1);return}
 try{const s=await db.collection('answers').get();(s.docs||s).forEach(d=>{const v=d.data?d.data():d;if(d.id)A[d.id]={choice:v.choice??null,own:v.own||'',at:v.at}});status('Ready. Answers save as you tap.');const f=Q.findIndex(q=>!done(q));if(f>0)pos=f;render()}catch(e){status('Could not load saved answers. New answers will still save.',1)}})();
</script>
