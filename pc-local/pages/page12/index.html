<title>X2F Questions 12</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Same shape as the question page: one explanation at a time, ink for the choice, orange for the recommendation. */
:root{--bg:#f6f6f3;--panel:#fff;--fg:#17181a;--muted:#5d6066;--line:#d9d9d3;--ink:#17181a;--on:#fff;--accent:#c2500a;--bad:#a3211b;--body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121315;--panel:#1b1d20;--fg:#f0f0ec;--muted:#a5a8ad;--line:#33363b;--ink:#f0f0ec;--on:#121315;--accent:#ff9a57;--bad:#ff8f87;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121315;--panel:#1b1d20;--fg:#f0f0ec;--muted:#a5a8ad;--line:#33363b;--ink:#f0f0ec;--on:#121315;--accent:#ff9a57;--bad:#ff8f87;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
h1{font-size:18px;margin:0}.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ink)}
.save{font-size:13px;color:var(--muted);min-height:20px}.save.bad{color:var(--bad)}
main{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tag{font-size:13px;color:var(--muted)}h2{font-size:21px;line-height:1.3;margin:0;text-wrap:balance}
.note{margin:0;white-space:pre-line}
.opt{display:flex;gap:10px;text-align:left;width:100%;background:none;color:inherit;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:8px}
.opt[aria-checked=true]{background:var(--ink);color:var(--on);border-color:var(--ink)}.opt[aria-checked=true] .rec{color:var(--on)}
.rec{color:var(--accent);font-weight:600;white-space:nowrap}
label{font-weight:600}textarea{width:100%;min-height:100px;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:8px}.btn{border:1.5px solid var(--line);background:none;color:inherit;font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--on);border-color:var(--ink)}.btn:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap">
<div class="top"><h1>X2F questions, page 12: chat keys, staff and the audit log</h1><span class="count" id="count"></span></div>
<div class="bar"><i id="bar"></i></div>
<div class="save" id="save" role="status">Loading your saved answers…</div>
<main id="card"></main>
</div>
<script>
const Q=[{"s": "Chat privacy", "q": "Moderators can never read a chat unless there's a dispute. Does that include you?", "n": "This is the heart of the design: no one at X2F, you included, can open a chat without a dispute, and no one has a master key. A trader who complains outside a dispute gets told to open one.", "o": ["Yes, nobody reads a chat without a dispute, me included", "I want the owner to be able to open any chat"], "r": 0}, {"s": "Chat privacy", "q": "When the system opens a dispute by itself, how does X2F get the chat key?", "n": "If a trade times out and the system opens a dispute with no trader pressing the button, one trader's app has to hand X2F the key. Automatic: it happens the next time either trader opens the app, and a \"moderator called in\" banner shows. Or the app can ask the trader to tap Allow first, which is stronger but lets a cheater stall by never tapping.", "o": ["Automatic, with the banner", "Ask the trader to tap Allow"], "r": 0}, {"s": "Chat privacy", "q": "If both traders lose their phones or computers, that chat can never be read again. Accept that?", "n": "Not even X2F could read it. The moderator would decide on proofs and statements alone. It's rare, and it's what makes the encryption real.", "o": ["Yes, accept it", "No, X2F must keep a way in"], "r": 0}, {"s": "Chat privacy", "q": "How do seniors and you get into a disputed chat?", "n": "Added to that one case, like the first moderator, with the addition logged. You see the whole chat and the first moderator's actions. Nobody gets a master key to every chat.", "o": ["Added per case, logged, no master key", "Seniors and the owner get a master key"], "r": 0}, {"s": "Logins", "q": "Approving a new device: the same 6-digit code on both screens?", "n": "Today the approving device picks one of three numbers. For handing over chat keys that isn't safe enough. Instead both screens show the same 6-digit code and you tap only if they match. The new device then has full abilities at once, no 24-hour wait, as you asked. With no other device online, the new device can still log in but can't open old chats.", "o": ["Yes, matching 6-digit code, full abilities at once", "Keep the pick-one-of-three numbers"], "r": 0}, {"s": "Staff", "q": "A removed staff member can't un-see what they read. Build a key change for their cases now?", "n": "We stop all their future access at once and log it on every case they were on. Changing each case's key when someone is removed is about a week of work.", "o": ["Don't build the key change now", "Build it before launch"], "r": 0}, {"s": "Chat erasing", "q": "When is the audit log destroyed?", "n": "The log of who tapped what and when, per trade. Option one: on the chat's own clock, 30 days after an undisputed trade closes and 90 days after a dispute or appeal closes. Option two: the moment the trade completes, which loses the record while a dispute can still be opened.", "o": ["On the chat's clock: 30 days, or 90 after a dispute closes", "The moment the trade completes"], "r": 0}, {"s": "Staff", "q": "Staff-wide events stay in a permanent log?", "n": "Hiring, settings changes and site stops aren't about one trade. They'd stay in a permanent log, separate from the per-trade logs that get destroyed.", "o": ["Yes, permanent", "No, erase those too after a set time"], "r": 0}, {"s": "Chat erasing", "q": "Backups: build \"backups shred too\" before launch?", "n": "For up to 14 days after a disputed chat is destroyed, someone holding both servers' backups and the moderation key could piece it back together. Undisputed chats can never be recovered. Closing this takes about a week. Until it's built, the terms would say \"within 14 days\".", "o": ["Build it before launch", "Launch without it; the terms say within 14 days"], "r": 0}, {"s": "Staff", "q": "Staff open the staff site only from a checked, pinned copy?", "n": "Whoever controls the code a browser receives can read what that browser decrypts. A pinned copy means a short setup step for each staff member, and then the server can't swap the code under them.", "o": ["Yes, pinned copy for staff", "No, normal browser is fine"], "r": 0}, {"s": "Staff", "q": "Who sees the audit log?", "n": "Proposed: you see everything; a senior sees everything on their own cases, including the first moderator's actions; a moderator sees the traders' actions and their own, not other staff members' entries.", "o": ["As proposed", "Every staff member sees everything on their cases"], "r": 0}, {"s": "Chat erasing", "q": "Where are the \"privacy tool scrubbed\" training copies made and kept?", "n": "Proposed: made in the staff member's own browser and destroyed when the dispute's 90 days end.", "o": ["In the staff browser, destroyed at 90 days", "Keep them longer for training"], "r": 0}, {"s": "Staff", "q": "A staff-only thread on each case, for questions to the previous moderator?", "n": "Traders never see it. It uses the same member keys. It's a small task that can come later.", "o": ["Yes, later", "Not needed"], "r": 0}, {"s": "Chat privacy", "q": "Chats are no longer stored on the phone; the app reads them live every time?", "n": "This matches what you believed. The phone needs to be online to read a chat, and a long chat over Tor may take a few seconds to load.", "o": ["Yes, read live, nothing stored", "Keep a copy on the phone, erased on purge"], "r": 0}, {"s": "Accounts", "q": "The 60-day inactivity close applies to all trader accounts, never to staff, owner or team-member logins?", "n": "That's how it's built. Confirming.", "o": ["Yes", "No, staff too"], "r": 0}];
Q.forEach((x,i)=>{x.id='p12-'+(i+1);x.n0=i+1});
let db=null,A={},pos=0,tm=null;const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const done=q=>{const a=A[q.id];return !!a&&(a.choice!=null||(a.own||'').trim()!=='')};
function status(t,b){const s=$('save');s.textContent=t;s.className='save'+(b?' bad':'')}
function draft(s){try{if(s)localStorage.setItem('x2f-q12',JSON.stringify(A));else return JSON.parse(localStorage.getItem('x2f-q12')||'{}')}catch(e){}return {}}
async function save(q){draft(1);if(!db){status('Saved on this device only. Tell the lead.',1);return}
 try{await db.doc('answers/'+q.id).set({n:q.n0,question:q.q,...A[q.id]});status('Saved. The lead can read this answer.')}catch(e){status('That answer did not save. Try it again.',1)}}
function render(){const n=Q.filter(done).length;$('count').textContent=n+'/'+Q.length+' answered';$('bar').style.width=(n/Q.length*100)+'%';
 const c=$('card');c.replaceChildren();
 if(pos>=Q.length){c.append(el('h2',null,n===Q.length?'All answered':n+' of '+Q.length+' answered'),el('p','note','Tell the lead you\'re done.'));const b=el('button','btn','Back');b.onclick=()=>{pos=Q.length-1;render()};c.append(b);return}
 const q=Q[pos],cur=A[q.id];c.append(el('div','tag',q.s+' · '+(pos+1)+' of '+Q.length),el('h2',null,q.q));if(q.n)c.append(el('p','note',q.n));
 const o=el('div','opts');o.setAttribute('role','radiogroup');o.setAttribute('aria-label','Your answer');
 q.o.forEach((l,i)=>{const b=el('button','opt');b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(!!cur&&cur.choice===l));const t=el('span',null,l+' ');if(i===q.r)t.append(el('span','rec','(Recommended)'));b.append(t);
  b.onclick=()=>{A[q.id]={choice:l,own:'',at:new Date().toISOString()};save(q);render();clearTimeout(tm);tm=setTimeout(()=>{pos++;render()},350)};o.append(b)});c.append(o);
 const lb=el('label',null,'Or write your own answer');lb.htmlFor='own-'+q.id;const ta=el('textarea');ta.id='own-'+q.id;ta.placeholder='Type your full answer here';ta.value=cur&&cur.own||'';
 let t2=null;ta.oninput=()=>{clearTimeout(t2);status('Saving…');t2=setTimeout(()=>{A[q.id]={choice:null,own:ta.value,at:new Date().toISOString()};save(q);[...o.children].forEach(b=>b.setAttribute('aria-checked','false'))},600)};c.append(lb,ta);
 const nv=el('div','nav'),bk=el('button','btn','Back');bk.disabled=pos===0;bk.onclick=()=>{pos--;render()};const nx=el('button','btn pri',pos<Q.length-1?'Next':'Finish');nx.onclick=()=>{pos++;render()};nv.append(bk,nx);c.append(nv)}
A=draft();render();
(async()=>{db=window.claude?await claude.use('db').catch(()=>null):null;if(!db){status('Answers are saving on this device only. Tell the lead.',1);return}
 try{const s=await db.collection('answers').get();(s.docs||s).forEach(d=>{const v=d.data?d.data():d;if(d.id)A[d.id]={choice:v.choice??null,own:v.own||'',at:v.at}});status('Ready. Answers save as you tap.');const f=Q.findIndex(q=>!done(q));if(f>0)pos=f;render()}catch(e){status('Could not load saved answers. New answers will still save.',1)}})();
</script>
