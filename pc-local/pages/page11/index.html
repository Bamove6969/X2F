:root[data-theme="dark"]{--bg:#121315;--panel:#1b1d20;--fg:#f0f0ec;--muted:#a5a8ad;--line:#33363b;--ink:#f0f0ec;--on:#121315;--accent:#ff9a57;--bad:#ff8f87;color-scheme:dark}

<script>
const Q=[{"s": "Chat encryption", "q": "Should trade chats move to Matrix (Megolm) encryption?", "n": "A security review compared Matrix/Megolm with the encryption X2F already has (each message locked to the buyer, the seller and the moderator; the moderator key lives only in the separate moderation service). Matrix would take about 2 to 4 months plus running a new server, which stores who talks to whom and when in plain form, and adds a second crypto system. It adds little the current design can't do more simply. The things you asked for (staff see the history, logged; keys destroyed at close) take about 2 to 3 weeks on what exists.", "o": ["No: keep X2F's own encryption and add the staff access and key destruction", "Yes: move to Matrix"], "r": 0}, {"s": "Chat encryption", "q": "When a staff member opens a disputed chat, where should it be unlocked?", "n": "Option 1: the moderation service unlocks it and sends readable text through the main server to the staff member. Option 2: the moderation service hands the staff member's own device a key for that chat; the chat is unlocked only on the staff device, the main server never sees the text, and every grant is logged. Option 2 is safer: a broken-into main server can't read disputes.", "o": ["Staff device unlocks it (the main server never sees the text)", "The moderation service unlocks it and sends the text through the server"], "r": 0}, {"s": "Chat encryption", "q": "What may X2F promise about deleted chats?", "n": "At the end of a chat's keep time we destroy its keys, so nobody can ever read it again. Encrypted copies stay in server backups for up to 14 days, but they're unreadable once the keys are gone. With about a week of extra work, the keys in backups are destroyed too, so the promise is airtight from day one.", "o": ["Build the extra week: keys destroyed everywhere, backups included", "Promise \"unreadable\" as is: backups keep scrambled copies up to 14 days"], "r": 0}, {"s": "Chat encryption", "q": "Should traders be able to use their chat on a second device?", "n": "Today a trade's chat works fully on the device that opened it; a second device can read it but not send. Making it work on several devices is about 1 to 2 weeks.", "o": ["Yes, build multi-device chat", "Not now; one device per trade is fine for launch"], "r": 1}, {"s": "Chat encryption", "q": "When a staff member is removed, should the log record that their chat access was revoked?", "n": "No system can make someone forget what they already read. We can stop all future access at once and write it in the activity log.", "o": ["Yes, log the revocation", "No log entry needed"], "r": 0}, {"s": "Launch safety", "q": "What should the most anyone can trade at once be for the first few months?", "n": "You asked for a fast launch before the big paid audit. A cap per trade limits how much any one flaw can cost. It can be raised later as the code proves itself. Design suggested $500.", "o": ["$500 per trade", "$1,000 per trade", "No launch cap"], "r": 0}, {"s": "Launch safety", "q": "Before real money moves, should we pay a freelance cryptographer to review the chat and proof encryption?", "n": "This is the cheaper step in place of a $20,000 to $60,000 full audit. One specialist reviews the short written design and the core encryption code. Expect about $2,000 to $8,000. The full audit can still come after launch from revenue or a grant.", "o": ["Yes, budget up to $8,000 before real money moves", "Not before launch; rely on our own reviews and public review of the design"], "r": 0}, {"s": "Launch safety", "q": "May I turn on GitHub's free security alerts and automatic security fixes for the X2F repository?", "n": "These are settings on your GitHub account's repository, so I'd like your yes first. GitHub then tells us when something we depend on has a known hole, and opens a proposed fix. Nothing merges by itself: every fix still goes through our checks. It costs nothing.", "o": ["Yes, turn them on", "Not yet"], "r": 0}, {"s": "Chat erasing", "q": "The signup terms say dispute records are kept 30 days. You ruled 90. What should the terms say?", "n": "The terms a trader agrees to at signup say dispute records are kept for 30 days after the dispute closes. Your 8 Nov ruling keeps a disputed chat for 90 days, and you said that's for training purposes. The terms have to match what we really do. They can state the 90 days alone, or also say why.", "o": ["Say 90 days, and say it's kept to train staff and improve dispute decisions", "Say 90 days, without giving the reason"], "r": 0}, {"s": "Chat erasing", "q": "When a chat is erased, should the copy on the trader's own phone or computer be erased too?", "n": "Today the trader's device keeps its own readable copy of the chat. We can make the app delete it automatically when the keep time ends, the next time the trader opens the app. A device that's never opened again keeps its copy, and nobody can stop a screenshot. The screens say \"erased for good\", so leaving device copies makes that line less true.", "o": ["Yes, the app erases its copy too", "No, only erase what X2F holds, and reword the line to say so"], "r": 0}, {"s": "Chat erasing", "q": "You said a disputed chat is kept 90 days. When should the 90 days start?", "n": "I built it to count from the day the dispute closes, because a long dispute could otherwise use up the 90 days and erase the chat while staff still need it. That was my reading of your ruling, so I'm checking it with you. Design's chat line already says \"90 days after a dispute closes\".", "o": ["From the day the dispute closes", "From the day the dispute is opened"], "r": 0}, {"s": "Working demo", "q": "How do you want to open the full working demo on your phone?", "n": "The demo runs on your PC with fake Monero. It needs a web address your phone can reach, and there are two ways.\nPublic link: I can make one in about a minute. Anyone who gets the address can open the demo, though it's a long random address, the money is fake, and I shut it off when you're done. Cloudflare carries the traffic.\nTailscale: private to your own devices. You'd need to install it on the PC and your phone and sign in.", "o": ["Public link, only while I'm testing", "Tailscale, I'll install it"], "r": 0}, {"s": "Signature at signup", "q": "How long should a trader's signature be kept after their account closes?", "n": "You asked for a signature when an account opens. Today it would never be deleted, and the terms don't mention it, while they promise X2F deletes what it doesn't need. Whatever you choose, the terms will say so and everyone re-agrees to the updated version.", "o": ["Erase it when the account closes", "Keep it 90 days after closing, then erase it"], "r": 0}, {"s": "Signature at signup", "q": "Should team members and staff sign too?", "n": "Only traders sign at the moment. Team members and staff get their accounts through an invitation and never see the signature step.", "o": ["Yes, everyone who gets a login signs", "No, only the account owner signs"], "r": 0}, {"s": "Signature at signup", "q": "If someone can't draw, what should the typed signature box ask for?", "n": "It now says \"Type your name to sign\". But the terms say X2F doesn't ask for your name, and a typed real name could identify someone who wants to stay private. I recommend asking for anything they choose.", "o": ["\"Type anything to sign, like your initials or username\"", "Keep \"Type your name to sign\""], "r": 0}, {"s": "Trade rules", "q": "Should the seller be able to open a dispute before the buyer taps \"I've paid\"?", "n": "Your rule stops the buyer disputing before \"I've paid\", and makes both sides wait the payment method's full time after it. It doesn't cover the seller before that point. As built, a seller can open a dispute one minute after the escrow is secured. That freezes the trade, and a buyer about to tap \"I've paid\" is refused. Until the buyer taps it, there's nothing for a moderator to rule on, and the seller already has the cancel route once the time to pay is up.", "o": ["No: before \"I've paid\", neither side can dispute", "Yes: leave the seller able to dispute at any time"], "r": 0}, {"s": "Chat erasing", "q": "Two of your answers differ. When should a completed trade's chat and its keys be destroyed?", "n": "On the deleted-chats question you wrote that keys are destroyed at the 48 hour mark unless a dispute happens. On the signup terms question you wrote that completed trades are destroyed on the 30th day. What's built now is 30 days, which is also your 8 Nov ruling. After destruction nobody can read that chat, so if it goes at 48 hours there's nothing for a moderator to look at after that.", "o": ["30 days after the trade closes, as built", "48 hours after the trade closes", "Keys at 48 hours, the scrambled data at 30 days"], "r": 0}, {"s": "Trade rules", "q": "With no final alert, a buyer who paid but didn't tap \"I've paid\" in time can't stop the seller's refund. Is that what you want?", "n": "Your 8 Nov rule removed the 15-minute final alert: once the time to pay is up, the seller's cancel sends the XMR back at once. So a buyer who sent the money but tapped \"I've paid\" too late gets the refund anyway. Their remedy is to open a dispute afterwards, and the moderator orders the seller to send the XMR. That's what's built. The alternative is a short freeze, say 5 minutes, after the seller's cancel in which a late \"I've paid\" still halts the refund.", "o": ["Yes: refund at once, the buyer disputes afterwards", "Add a short freeze so a late \"I've paid\" still halts the refund"], "r": 0}, {"s": "Staff logins", "q": "Must moderators' passkeys be hardware devices?", "n": "Your rule says moderators log in with all three methods: PGP key, security key and passkey. A moderator could register the same physical security key as their passkey too, which turns \"two of three\" into one device plus its PIN. We now catch the common case by the key's model ID, but a hostile browser can hide that ID. Closing the gap fully means refusing every moderator passkey that isn't a verified hardware device, which rules out iPhone, Android and password-manager passkeys for staff. Only the moderator can do this to their own account, and their PIN is still needed.", "o": ["Accept the current check; synced phone passkeys stay allowed for staff", "Hardware-only passkeys for moderators and seniors"], "r": 0}, {"s": "Reputation", "q": "For the Fast badge, should a buyer's speed count from when they tap \"I've paid\", or when the seller confirms the money arrived?", "n": "Today a buyer's time is measured to their \"I've paid\" tap. A buyer who taps early and pays later records a fast time they didn't earn. Measuring to the seller's confirmation is honest but also counts the bank's own delay against the buyer.", "o": ["To the seller's confirmation of the money", "To the buyer's \"I've paid\" tap, as now"], "r": 0}, {"s": "24-hour hold", "q": "From a username-and-password login, should inviting a new team member be held 24 hours like other changes, or refused outright?", "n": "Your rule holds every important change from a weak login for 24 hours, removals included. Today an invite from such a login is simply refused, under an earlier rule. Holding it instead would let the lead send the invite, with the member able to join only after the 24 hours, and the lead able to cancel it in the meantime.", "o": ["Hold it 24 hours like every other change", "Keep refusing it; invites need a strong login"], "r": 0}, {"s": "24-hour hold", "q": "Should a team member with hold rights be able to cancel or approve the lead's waiting TEAM changes, such as removing or demoting a member?", "n": "You gave team leads three grantable rights: see waiting changes, untick or cancel them, end the hold. An earlier rule says only the lead kicks members. As built, a member with the cancel right could cancel any waiting change, including one that removes them, which we've now blocked. The open question is whether members with the right may touch team changes at all, or only account and wallet changes.", "o": ["Hold rights cover account and wallet changes only; team changes stay with the lead", "Hold rights cover every waiting change, except ones naming that member"], "r": 0}, {"s": "24-hour hold", "q": "Two of your hold rules met in the build. Is this how you want them combined?", "n": "Your rule says the real owner can log in with the old password and kick out a thief. Your other rule holds every change from a weak login 24 hours. As built now: each waiting change keeps its own date, so a thief can't keep pushing your own change back by submitting more; and a password login can end other password logins that started AFTER it, so your older session can kick out the thief's newer one, but a thief who got in before you can't kick you out. If the thief logged in first, your way out is the recovery code login, which ends everything.", "o": ["Yes, that's the combination I want", "No, I want something different (write it below)"], "r": 0}, {"s": "Signing up", "q": "Should the signup form tell someone at once whether a username is still free?", "n": "The new signup asks for one private username on the first screen, with a live tick that says whether it's free. That tick is handy, but it also lets a stranger test names: about 14,000 a day per server. Your private username is half of your login, so knowing it exists helps someone attack the password. Until now we hid that on purpose and only said \"taken\" at the very end of signup.", "o": ["No live tick: check the name at the end of signup, as before", "Keep the live tick"], "r": 0}, {"s": "Teams", "q": "In a trade chat, how should a team member's message be labelled?", "n": "Your 28 Oct rule says the chat shows \"Message from Team Calcium member: Aurora\". Design's gap list later said the other trader should never see which member wrote. Design now agrees with your 28 Oct words. Please confirm.", "o": ["\"Message from Team <account> member: <member name>\", as you said on 28 Oct", "Show only the team account's name, never the member"], "r": 0}, {"s": "Teams", "q": "Can a team member's username-and-password login put the whole team account on a 24-hour hold?", "n": "You allowed team members any login method. A weak login (username and password) normally puts security changes on a 24-hour hold. The question is whose account: the member's own login only, or the team lead's whole account, which would freeze the lead's changes because of a member's weak login.", "o": ["Only the member's own login methods are held; the team account never freezes because of a member", "Treat it like the lead's own login: the team account goes on hold"], "r": 0}, {"s": "Teams", "q": "Should a new team member's first login be approved by the team lead?", "n": "A new device for a trader is approved from a device that's already logged in, with a number to match. For a member joining a team, the invite could be enough, or the lead could also approve the first login the same way.", "o": ["Yes, the lead approves the member's first login with the number match", "No, the invite is enough"], "r": 0}, {"s": "Teams", "q": "Do team members get their own recovery codes?", "n": "Recovery codes are the emergency way back into an account. Members could have their own, or a locked-out member could simply be removed and invited again by the lead, which keeps fewer secrets around.", "o": ["No: a locked-out member is removed and invited again by the lead", "Yes, members get their own recovery codes"], "r": 0}, {"s": "Trade rules", "q": "How long should a buyer get to pay, per payment type?", "n": "The time to pay is now set per payment type when the trade starts. The builder's defaults, pending your word: 90 minutes for payment apps and instant transfers; 3 hours for ordinary bank transfers; 24 hours for cash by mail and other slow types. The buyer sees \"can take up to N\" when picking the type.", "o": ["Use these: 90 min apps and instant, 3 h bank, 24 h cash by mail", "Different numbers (write them below)"], "r": 0}, {"s": "Launch safety", "q": "While the price feed is down, should no trade be taken at all?", "n": "The $5,000 launch cap needs a dollar price to check against. When the price feed is down or stale, the cap can't be checked, so the build refuses to start any trade until the price is back. Market-price offers already pause then; this adds the same pause to everything.", "o": ["Yes: no new trades while the price is unknown", "Let trades start without the cap check while the price is down"], "r": 0}, {"s": "Jabber alerts", "q": "Must Jabber alerts be encrypted (OMEMO) to be sent at all?", "n": "Your 29 Oct decision was \"OMEMO Jabber over Tor only\". The design board says \"OMEMO recommended\". If OMEMO is only recommended, X2F would send an alert in the clear to someone who didn't set it up, and their Jabber server could read it. The alerts say little (\"something changed on your account\"), but they reveal that the address belongs to an X2F user.", "o": ["Required: X2F refuses to send an alert that can't be encrypted", "Recommended: send it anyway if the person didn't set up OMEMO"], "r": 0}, {"s": "Jabber alerts", "q": "What counts as an account change worth a Jabber alert?", "n": "The builder's defaults: a new or changed login method, wallet, password, team member, Terms acceptance, a moderator's trading hold, and disabling the account send an alert; ordinary logins, offers and trades do not. A weak login or a running 24-hour hold can't change the Jabber address.", "o": ["Use these defaults", "Change them (write below)"], "r": 0}, {"s": "Chat erasing", "q": "How long should the server remember that a chat was erased?", "n": "When a chat is erased, a phone that was offline needs to learn that later so it can erase its own copy and keys. The server keeps a small mark (no content, just \"this chat is gone\") for that. The builder set 365 days.", "o": ["365 days", "Forever", "90 days"], "r": 0}, {"s": "24-hour hold", "q": "Should a correct recovery code always get in, even when logins are being throttled?", "n": "After many wrong tries, logins slow to one try every 30 seconds. A thief who holds your password and a copied cookie can keep firing wrong tries, so your own recovery login is held up too while their change waits out its 24 hours. A recovery code has 16 characters and can't be guessed, so letting a correct one through at once closes that lock-out.", "o": ["Yes: a correct recovery code always gets in", "No: keep the throttle for recovery codes too"], "r": 0}, {"s": "24-hour hold", "q": "Two limits of sharing a password with a thief: accept them?", "n": "With username and password only, you and a thief hold the same key, so: (1) either of you can cancel the other's waiting change, and the owner must submit again with a new 24 hours; (2) if the thief logged in BEFORE your current session, they can end your newer logins, and you can't end theirs. In both cases the recovery code login is the way out: it ends everything and starts your own 24 hours.", "o": ["Accept these limits; the recovery code is the way out", "Change it (write how below)"], "r": 0}, {"s": "24-hour hold", "q": "When a recovery code is used and replaced, should the app tell the person the old code no longer works?", "n": "After a recovery login the old code is spent and a new one is made. If the person never sees that notice, they may keep the old code written down and find it dead when they need it.", "o": ["Yes, show a clear notice", "No notice needed"], "r": 0}, {"s": "Disputes", "q": "Between the seller's cancel and the refund landing, what should the dispute room say?", "n": "For a few minutes after the seller cancels, the coins are on their way back but not yet confirmed. The room now says \"Locked in escrow\". Design proposes \"Refund on its way\" in the caution colour until it confirms.", "o": ["\"Refund on its way\" until the refund confirms", "Keep \"Locked in escrow\""], "r": 0}, {"s": "Working demo", "q": "Where should the working demo live so it stays up?", "n": "The demo runs on your PC and dies when the PC reboots or sleeps. The code is on GitHub, but a running copy needs a machine that stays on. Options: a small rented server (a few dollars a month, always on, your devices only through Tailscale); keep it on the PC; or the lead runs it in its cloud session, which only lives while the session is awake.", "o": ["A small rented server, always on", "Keep it on the PC", "In the lead's cloud session while it's awake"], "r": 0}, {"s": "Working demo", "q": "You said the previous demo was better. What was better about it?", "n": "Design reviewed the real app against the prototype and listed eight gaps, most now built: the landing page, the wide layout, the logo, the quote screen, the offer cards' trust row, signup with one username, the sell list. Tell us what you missed so we aim at the right thing.", "o": ["The look and feel", "The flow between screens", "Both (write below what stood out)"], "r": 2}, {"s": "Records", "q": "Should the raw chat transcripts of the lead's sessions be archived in the private repository?", "n": "You uploaded them to the lead directly. They hold your words and the lead's, plus helper reports. The private repository already holds notes and reviews; the transcripts would make the record complete, but they also carry things like session links and account names.", "o": ["No: keep them out of GitHub, the lead keeps the digest", "Yes, archive them on the notes branch"], "r": 0}];
Q.forEach((x,i)=>{x.id='p11-'+(i+1);x.n0=i+1});
let db=null,A={},pos=0,tm=null;const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const done=q=>{const a=A[q.id];return !!a&&(a.choice!=null||(a.own||'').trim()!=='')};
function status(t,b){const s=$('save');s.textContent=t;s.className='save'+(b?' bad':'')}
function draft(s){try{if(s)localStorage.setItem('x2f-q11',JSON.stringify(A));else return JSON.parse(localStorage.getItem('x2f-q11')||'{}')}catch(e){}return {}}
async function save(q){draft(1);if(!db){status('Saved on this device only. Tell the lead.',1);return}
 try{await db.doc('answers/'+q.id).set({n:q.n0,question:q.q,...A[q.id]});status('Saved. The lead can read this answer.')}catch(e){status('That answer did not save. Try it again.',1)}}
function render(){const n=Q.filter(done).length;$('count').textContent=n+'/'+Q.length+' answered';$('bar').style.width=(n/Q.length*100)+'%';
 const c=$('card');c.replaceChildren();
 if(pos>=Q.length){c.append(el('h2',null,n===Q.length?'All answered':n+' of '+Q.length+' answered'),el('p','note','Tell the lead you\'re done.'));const b=el('button','btn','Back');b.onclick=()=>{pos=Q.length-1;render()};c.append(b);return}
 const q=Q[pos],cur=A[q.id];c.append(el('div','tag',q.s+' · '+(pos+1)+' of '+Q.length),el('h2',null,q.q));if(q.n)c.append(el('p','note',q.n));
 const o=el('div','opts');o.setAttribute('role','radiogroup');o.setAttribute('aria-label','Your answer');
 q.o.forEach((l,i)=>{const b=el('button','opt');b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(!!cur&&cur.choice===l));const t=el('span',null,l+' ');if(i===q.r)t.append(el('span','rec','(Recommended)'));b.append(t);
  b.onclick=()=>{A[q.id]={choice:l,own:'',at:new Date().toISOString()};save(q);render();clearTimeout(tm);tm=setTimeout(()=>{pos++;render()},350)};o.append(b)});c.append(o);
 const lb=el('label',null,'Or write your own answer');lb.htmlFor='own-'+q.id;const ta=el('textarea');ta.id='own-'+q.id;ta.placeholder='Type your full answer here';ta.value=cur&&cur.own||'';
 let t2=null;ta.oninput=()=>{clearTimeout(t2);status('Saving…');t2=setTimeout(()=>{A[q.id]={choice:null,own:ta.value,at:new Date().toISOString()};save(q);[...o.children].forEach(b=>b.setAttribute('aria-checked','false'))},600)};c.append(lb,ta);
 const nv=el('div','nav'),bk=el('button','btn','Back');bk.disabled=pos===0;bk.onclick=()=>{pos--;render()};const nx=el('button','btn pri',pos<Q.length-1?'Next':'Finish');nx.onclick=()=>{pos++;render()};nv.append(bk,nx);c.append(nv)}
A=draft();render();
(async()=>{db=window.claude?await claude.use('db').catch(()=>null):null;if(!db){status('Answers are saving on this device only. Tell the lead.',1);return}
 try{const s=await db.collection('answers').get();(s.docs||s).forEach(d=>{const v=d.data?d.data():d;if(d.id)A[d.id]={choice:v.choice??null,own:v.own||'',at:v.at}});status('Ready. Answers save as you tap.');const f=Q.findIndex(q=>!done(q));if(f>0)pos=f;render()}catch(e){status('Could not load saved answers. New answers will still save.',1)}})();
</script>
