<script>
const Q=[{"s": "Chat encryption", "q": "Should trade chats move to Matrix (Megolm) encryption?", "n": "A security review compared Matrix/Megolm with the encryption X2F already has (each message locked to the buyer, the seller and the moderator; the moderator key lives only in the separate moderation service). Matrix would take about 2 to 4 months plus running a new server, which stores who talks to whom and when in plain form, and adds a second crypto system. It adds little the current design can't do more simply. The things you asked for (staff see the history, logged; keys destroyed at close) take about 2 to 3 weeks on what exists.", "o": ["No: keep X2F's own encryption and add the staff access and key destruction", "Yes: move to Matrix"], "r": 0}, {"s": "Chat encryption", "q": "When a staff member opens a disputed chat, where should it be unlocked?", "n": "Option 1: the moderation service unlocks it and sends readable text through the main server to the staff member. Option 2: the moderation service hands the staff member's own device a key for that chat; the chat is unlocked only on the staff device, the main server never sees the text, and every grant is logged. Option 2 is safer: a broken-into main server can't read disputes.", "o": ["Staff device unlocks it (the main server never sees the text)", "The moderation service unlocks it and sends the text through the server"], "r": 0}, {"s": "Chat encryption", "q": "What may X2F promise about deleted chats?", "n": "At the end of a chat's keep time we destroy its keys, so nobody can ever read it again. Encrypted copies stay in server backups for up to 14 days, but they're unreadable once the keys are gone. With about a week of extra work, the keys in backups are destroyed too, so the promise is airtight from day one.", "o": ["Build the extra week: keys destroyed everywhere, backups included", "Promise \"unreadable\" as is: backups keep scrambled copies up to 14 days"], "r": 0}, {"s": "Chat encryption", "q": "Should traders be able to use their chat on a second device?", "n": "Today a trade's chat works fully on the device that opened it; a second device can read it but not send. Making it work on several devices is about 1 to 2 weeks.", "o": ["Yes, build multi-device chat", "Not now; one device per trade is fine for launch"], "r": 1}, {"s": "Chat encryption", "q": "When a staff member is removed, should the log record that their chat access was revoked?", "n": "No system can make someone forget what they already read. We can stop all future access at once and write it in the activity log.", "o": ["Yes, log the revocation", "No log entry needed"], "r": 0}, {"s": "Launch safety", "q": "What should the most anyone can trade at once be for the first few months?", "n": "You asked for a fast launch before the big paid audit. A cap per trade limits how much any one flaw can cost. It can be raised later as the code proves itself. Design suggested $500.", "o": ["$500 per trade", "$1,000 per trade", "No launch cap"], "r": 0}, {"s": "Launch safety", "q": "Before real money moves, should we pay a freelance cryptographer to review the chat and proof encryption?", "n": "This is the cheaper step in place of a $20,000 to $60,000 full audit. One specialist reviews the short written design and the core encryption code. Expect about $2,000 to $8,000. The full audit can still come after launch from revenue or a grant.", "o": ["Yes, budget up to $8,000 before real money moves", "Not before launch; rely on our own reviews and public review of the design"], "r": 0}, {"s": "Launch safety", "q": "May I turn on GitHub's free security alerts and automatic security fixes for the X2F repository?", "n": "These are settings on your GitHub account's repository, so I'd like your yes first. GitHub then tells us when something we depend on has a known hole, and opens a proposed fix. Nothing merges by itself: every fix still goes through our checks. It costs nothing.", "o": ["Yes, turn them on", "Not yet"], "r": 0}, {"s": "Chat erasing", "q": "The signup terms say dispute records are kept 30 days. You ruled 90. What should the terms say?", "n": "The terms a trader agrees to at signup say dispute records are kept for 30 days after the dispute closes. Your 8 Nov ruling keeps a disputed chat for 90 days, and you said that's for training purposes. The terms have to match what we really do. They can state the 90 days alone, or also say why.", "o": ["Say 90 days, and say it's kept to train staff and improve dispute decisions", "Say 90 days, without giving the reason"], "r": 0}, {"s": "Chat erasing", "q": "When a chat is erased, should the copy on the trader's own phone or computer be erased too?", "n": "Today the trader's device keeps its own readable copy of the chat. We can make the app delete it automatically when the keep time ends, the next time the trader opens the app. A device that's never opened again keeps its copy, and nobody can stop a screenshot. The screens say \"erased for good\", so leaving device copies makes that line less true.", "o": ["Yes, the app erases its copy too", "No, only erase what X2F holds, and reword the line to say so"], "r": 0}, {"s": "Chat erasing", "q": "You said a disputed chat is kept 90 days. When should the 90 days start?", "n": "I built it to count from the day the dispute closes, because a long dispute could otherwise use up the 90 days and erase the chat while staff still need it. That was my reading of your ruling, so I'm checking it with you. Design's chat line already says \"90 days after a dispute closes\".", "o": ["From the day the dispute closes", "From the day the dispute is opened"], "r": 0}, {"s": "Working demo", "q": "How do you want to open the full working demo on your phone?", "n": "The demo runs on your PC with fake Monero. It needs a web address your phone can reach, and there are two ways.\nPublic link: I can make one in about a minute. Anyone who gets the address can open the demo, though it's a long random address, the money is fake, and I shut it off when you're done. Cloudflare carries the traffic.\nTailscale: private to your own devices. You'd need to install it on the PC and your phone and sign in.", "o": ["Public link, only while I'm testing", "Tailscale, I'll install it"], "r": 0}, {"s": "Signature at signup", "q": "How long should a trader's signature be kept after their account closes?", "n": "You asked for a signature when an account opens. Today it would never be deleted, and the terms don't mention it, while they promise X2F deletes what it doesn't need. Whatever you choose, the terms will say so and everyone re-agrees to the updated version.", "o": ["Erase it when the account closes", "Keep it 90 days after closing, then erase it"], "r": 0}, {"s": "Signature at signup", "q": "Should team members and staff sign too?", "n": "Only traders sign at the moment. Team members and staff get their accounts through an invitation and never see the signature step.", "o": ["Yes, everyone who gets a login signs", "No, only the account owner signs"], "r": 0}, {"s": "Signature at signup", "q": "If someone can't draw, what should the typed signature box ask for?", "n": "It now says \"Type your name to sign\". But the terms say X2F doesn't ask for your name, and a typed real name could identify someone who wants to stay private. I recommend asking for anything they choose.", "o": ["\"Type anything to sign, like your initials or username\"", "Keep \"Type your name to sign\""], "r": 0}, {"s": "Trade rules", "q": "Should the seller be able to open a dispute before the buyer taps \"I've paid\"?", "n": "Your rule stops the buyer disputing before \"I've paid\", and makes both sides wait the payment method's full time after it. It doesn't cover the seller before that point. As built, a seller can open a dispute one minute after the escrow is secured. That freezes the trade, and a buyer about to tap \"I've paid\" is refused. Until the buyer taps it, there's nothing for a moderator to rule on, and the seller already has the cancel route once the time to pay is up.", "o": ["No: before \"I've paid\", neither side can dispute", "Yes: leave the seller able to dispute at any time"], "r": 0}, {"s": "Chat erasing", "q": "Two of your answers differ. When should a completed trade's chat and its keys be destroyed?", "n": "On the deleted-chats question you wrote that keys are destroyed at the 48 hour mark unless a dispute happens. On the signup terms question you wrote that completed trades are destroyed on the 30th day. What's built now is 30 days, which is also your 8 Nov ruling. After destruction nobody can read that chat, so if it goes at 48 hours there's nothing for a moderator to look at after that.", "o": ["30 days after the trade closes, as built", "48 hours after the trade closes", "Keys at 48 hours, the scrambled data at 30 days"], "r": 0}, {"s": "Trade rules", "q": "With no final alert, a buyer who paid but didn't tap \"I've paid\" in time can't stop the seller's refund. Is that what you want?", "n": "Your 8 Nov rule removed the 15-minute final alert: once the time to pay is up, the seller's cancel sends the XMR back at once. So a buyer who sent the money but tapped \"I've paid\" too late gets the refund anyway. Their remedy is to open a dispute afterwards, and the moderator orders the seller to send the XMR. That's what's built. The alternative is a short freeze, say 5 minutes, after the seller's cancel in which a late \"I've paid\" still halts the refund.", "o": ["Yes: refund at once, the buyer disputes afterwards", "Add a short freeze so a late \"I've paid\" still halts the refund"], "r": 0}, {"s": "Staff logins", "q": "Must moderators' passkeys be hardware devices?", "n": "Your rule says moderators log in with all three methods: PGP key, security key and passkey. A moderator could register the same physical security key as their passkey too, which turns \"two of three\" into one device plus its PIN. We now catch the common case by the key's model ID, but a hostile browser can hide that ID. Closing the gap fully means refusing every moderator passkey that isn't a verified hardware device, which rules out iPhone, Android and password-manager passkeys for staff. Only the moderator can do this to their own account, and their PIN is still needed.", "o": ["Accept the current check; synced phone passkeys stay allowed for staff", "Hardware-only passkeys for moderators and seniors"], "r": 0}, {"s": "Reputation", "q": "For the Fast badge, should a buyer's speed count from when they tap \"I've paid\", or when the seller confirms the money arrived?", "n": "Today a buyer's time is measured to their \"I've paid\" tap. A buyer who taps early and pays later records a fast time they didn't earn. Measuring to the seller's confirmation is honest but also counts the bank's own delay against the buyer.", "o": ["To the seller's confirmation of the money", "To the buyer's \"I've paid\" tap, as now"], "r": 0}, {"s": "24-hour hold", "q": "From a username-and-password login, should inviting a new team member be held 24 hours like other changes, or refused outright?", "n": "Your rule holds every important change from a weak login for 24 hours, removals included. Today an invite from such a login is simply refused, under an earlier rule. Holding it instead would let the lead send the invite, with the member able to join only after the 24 hours, and the lead able to cancel it in the meantime.", "o": ["Hold it 24 hours like every other change", "Keep refusing it; invites need a strong login"], "r": 0}, {"s": "24-hour hold", "q": "Should a team member with hold rights be able to cancel or approve the lead's waiting TEAM changes, such as removing or demoting a member?", "n": "You gave team leads three grantable rights: see waiting changes, untick or cancel them, end the hold. An earlier rule says only the lead kicks members. As built, a member with the cancel right could cancel any waiting change, including one that removes them, which we've now blocked. The open question is whether members with the right may touch team changes at all, or only account and wallet changes.", "o": ["Hold rights cover account and wallet changes only; team changes stay with the lead", "Hold rights cover every waiting change, except ones naming that member"], "r": 0}, {"s": "24-hour hold", "q": "Two of your hold rules met in the build. Is this how you want them combined?", "n": "Your rule says the real owner can log in with the old password and kick out a thief. Your other rule holds every change from a weak login 24 hours. As built now: each waiting change keeps its own date, so a thief can't keep pushing your own change back by submitting more; and a password login can end other password logins that started AFTER it, so your older session can kick out the thief's newer one, but a thief who got in before you can't kick you out. If the thief logged in first, your way out is the recovery code login, which ends everything.", "o": ["Yes, that's the combination I want", "No, I want something different (write it below)"], "r": 0}, {"s": "Signing up", "q": "Should the signup form tell someone at once whether a username is still free?", "n": "The new signup asks for one private username on the first screen, with a live tick that says whether it's free. That tick is handy, but it also lets a stranger test names: about 14,000 a day per server. Your private username is half of your login, so knowing it exists helps someone attack the password. Until now we hid that on purpose and only said \"taken\" at the very end of signup. The security review suggests a middle way: keep a live tick for the public display name (it reveals nothing new, display names are public) and check the private username only at the end.", "o": ["The tick checks only the public display name; the private username is checked at the end of signup", "No live tick at all: check both names at the end of signup, as before", "Keep the live tick for the private username"], "r": 0}, {"s": "Teams", "q": "In a trade chat, how should a team member's message be labelled?", "n": "Your 28 Oct rule says the chat shows \"Message from Team Calcium member: Aurora\". Design's gap list later said the other trader should never see which member wrote. Design now agrees with your 28 Oct words. Please confirm.", "o": ["\"Message from Team <account> member: <member name>\", as you said on 28 Oct", "Show only the team account's name, never the member"], "r": 0}, {"s": "Teams", "q": "Can a team member's username-and-password login put the whole team account on a 24-hour hold?", "n": "You allowed team members any login method. A weak login (username and password) normally puts security changes on a 24-hour hold. The question is whose account: the member's own login only, or the team lead's whole account, which would freeze the lead's changes because of a member's weak login.", "o": ["Only the member's own login methods are held; the team account never freezes because of a member", "Treat it like the lead's own login: the team account goes on hold"], "r": 0}, {"s": "Teams", "q": "Should a new team member's first login be approved by the team lead?", "n": "A new device for a trader is approved from a device that's already logged in, with a number to match. For a member joining a team, the invite could be enough, or the lead could also approve the first login the same way.", "o": ["Yes, the lead approves the member's first login with the number match", "No, the invite is enough"], "r": 0}, {"s": "Teams", "q": "Do team members get their own recovery codes?", "n": "Recovery codes are the emergency way back into an account. Members could have their own, or a locked-out member could simply be removed and invited again by the lead, which keeps fewer secrets around.", "o": ["No: a locked-out member is removed and invited again by the lead", "Yes, members get their own recovery codes"], "r": 0}, {"s": "Trade rules", "q": "How long should a buyer get to pay, per payment type?", "n": "The time to pay is now set per payment type when the trade starts. The builder's defaults, pending your word: 90 minutes for payment apps and instant transfers; 3 hours for ordinary bank transfers; 24 hours for cash by mail and other slow types. The buyer sees \"can take up to N\" when picking the type.", "o": ["Use these: 90 min apps and instant, 3 h bank, 24 h cash by mail", "Different numbers (write them below)"], "r": 0}, {"s": "Launch safety", "q": "While the price feed is down, should no trade be taken at all?", "n": "The $5,000 launch cap needs a dollar price to check against. When the price feed is down or stale, the cap can't be checked, so the build refuses to start any trade until the price is back. Market-price offers already pause then; this adds the same pause to everything.", "o": ["Yes: no new trades while the price is unknown", "Let trades start without the cap check while the price is down"], "r": 0}, {"s": "Jabber alerts", "q": "Must Jabber alerts be encrypted (OMEMO) to be sent at all?", "n": "Your 29 Oct decision was \"OMEMO Jabber over Tor only\". The design board says \"OMEMO recommended\". If OMEMO is only recommended, X2F would send an alert in the clear to someone who didn't set it up, and their Jabber server could read it. The alerts say little (\"something changed on your account\"), but they reveal that the address belongs to an X2F user.", "o": ["Required: X2F refuses to send an alert that can't be encrypted", "Recommended: send it anyway if the person didn't set up OMEMO"], "r": 0}, {"s": "Jabber alerts", "q": "What counts as an account change worth a Jabber alert?", "n": "The builder's defaults: a new or changed login method, wallet, password, team member, Terms acceptance, a moderator's trading hold, and disabling the account send an alert; ordinary logins, offers and trades do not. A weak login or a running 24-hour hold can't change the Jabber address.", "o": ["Use these defaults", "Change them (write below)"], "r": 0}, {"s": "Chat erasing", "q": "How long should the server remember that a chat was erased?", "n": "When a chat is erased, a phone that was offline needs to learn that later so it can erase its own copy and keys. The server keeps a small mark (no content, just \"this chat is gone\") for that. The builder set 365 days.", "o": ["365 days", "Forever", "90 days"], "r": 0}, {"s": "24-hour hold", "q": "Should a correct recovery code always get in, even when logins are being throttled?", "n": "After many wrong tries, logins slow to one try every 30 seconds. A thief who holds your password and a copied cookie can keep firing wrong tries, so your own recovery login is held up too while their change waits out its 24 hours. A recovery code has 16 characters and can't be guessed, so letting a correct one through at once closes that lock-out.", "o": ["Yes: a correct recovery code always gets in", "No: keep the throttle for recovery codes too"], "r": 0}, {"s": "24-hour hold", "q": "Two limits of sharing a password with a thief: accept them?", "n": "With username and password only, you and a thief hold the same key, so: (1) either of you can cancel the other's waiting change, and the owner must submit again with a new 24 hours; (2) if the thief logged in BEFORE your current session, they can end your newer logins, and you can't end theirs. In both cases the recovery code login is the way out: it ends everything and starts your own 24 hours.", "o": ["Accept these limits; the recovery code is the way out", "Change it (write how below)"], "r": 0}, {"s": "24-hour hold", "q": "When a recovery code is used and replaced, should the app tell the person the old code no longer works?", "n": "After a recovery login the old code is spent and a new one is made. If the person never sees that notice, they may keep the old code written down and find it dead when they need it.", "o": ["Yes, show a clear notice", "No notice needed"], "r": 0}, {"s": "Disputes", "q": "Between the seller's cancel and the refund landing, what should the dispute room say?", "n": "For a few minutes after the seller cancels, the coins are on their way back but not yet confirmed. The room now says \"Locked in escrow\". Design proposes \"Refund on its way\" in the caution colour until it confirms.", "o": ["\"Refund on its way\" until the refund confirms", "Keep \"Locked in escrow\""], "r": 0}, {"s": "Working demo", "q": "Where should the working demo live so it stays up?", "n": "The demo runs on your PC and dies when the PC reboots or sleeps. The code is on GitHub, but a running copy needs a machine that stays on. Options: a small rented server (a few dollars a month, always on, your devices only through Tailscale); keep it on the PC; or the lead runs it in its cloud session, which only lives while the session is awake.", "o": ["A small rented server, always on", "Keep it on the PC", "In the lead's cloud session while it's awake"], "r": 0}, {"s": "Working demo", "q": "You said the previous demo was better. What was better about it?", "n": "Design reviewed the real app against the prototype and listed eight gaps, most now built: the landing page, the wide layout, the logo, the quote screen, the offer cards' trust row, signup with one username, the sell list. Tell us what you missed so we aim at the right thing.", "o": ["The look and feel", "The flow between screens", "Both (write below what stood out)"], "r": 2}, {"s": "Records", "q": "Should the raw chat transcripts of the lead's sessions be archived in the private repository?", "n": "You uploaded them to the lead directly. They hold your words and the lead's, plus helper reports. The private repository already holds notes and reviews; the transcripts would make the record complete, but they also carry things like session links and account names.", "o": ["No: keep them out of GitHub, the lead keeps the digest", "Yes, archive them on the notes branch"], "r": 0}, {"s": "Signing up", "q": "Should an authenticator app still count as a backup way in, or only the recovery code?", "n": "The new signup offers only the recovery code as the backup login; an authenticator app can still be the main login. This came from design's gap list, not from you, and your 1 Nov table still had an authenticator-only backup. Accounts that already set an authenticator as their backup would be left with no backup unless we tell them.", "o": ["Recovery code only, as now built; tell existing accounts to save a recovery code", "Keep the authenticator app as a backup choice too"], "r": 0}, {"s": "Signing up", "q": "Approve the Terms line about names, and a new Terms version?", "n": "The Terms text still says \"public username and private login name\". The screens now say a private username and a public display name. Proposed line: \"a private username, which only you see, and a public display name\". Changing the Terms means a new version, and everyone agrees to it again at their next visit.", "o": ["Yes: use that line and bump the Terms version", "Different wording (write below)"], "r": 0}, {"s": "Teams", "q": "A team member has accepted the new Terms but the account owner hasn't. What should the member see?", "n": "You asked for more detail (9 Nov). Background: a vendor account can have team members (your \"Assistant 1\", \"Assistant 2\"). Each assistant has their own login but works inside the vendor's account. Your rule: everyone who gets a login signs the Terms. When we publish a new Terms version, each person must read and accept it at their next login before going on. The assistant and the account owner accept separately, so this can happen: the assistant logs in and accepts the new Terms; the account owner has not logged in since the change, so the owner has not accepted. The assistant is now working inside an account whose owner has not agreed to the current rules. The question is what the assistant sees at that moment. Choice 1: a screen saying the account owner must accept the new Terms first, with only a Log out button. Nothing happens on the account until the owner logs in and accepts. Safe, but the vendor's open trades stall: the assistant cannot answer chats or mark payments until the owner shows up. Choice 2: the assistant keeps working as before, under the old Terms the owner signed, until the owner next logs in and accepts. Simple, but the account runs for a while under rules its owner has not agreed to. Choice 3 (lead's recommendation): the assistant may finish what is already open (chat, mark paid, upload proof on open trades) but cannot post offers or take new trades until the owner accepts, and sees a banner saying why. Releasing coins is never an assistant's job anyway.", "o": ["Show that screen with Log out (account stalls until the owner accepts)", "Let the member keep trading on the old Terms until the owner accepts", "Open trades continue, no new offers or takes until the owner accepts (lead's recommendation)"], "r": 0}, {"s": "Teams", "q": "Is it OK that someone holding a team invite sees their given member name, roles and the invite's expiry before they accept the Terms?", "n": "The invite is the account owner's own secret, single-use, 24-hour link. It shows nothing from the marketplace and no longer names the account owner. The Terms come right after.", "o": ["Yes, that's fine", "No: show nothing until the Terms are accepted"], "r": 0}, {"s": "Jabber alerts", "q": "Should X2F's own Jabber alert account run on its own hidden (onion) server over Tor?", "n": "Your 29 Oct rule was Jabber over Tor only. As built, X2F connects over the normal internet, so a public Jabber server would see every user's Jabber address, when each account change happened, and the timing of dispute notices. Running X2F's own onion-only Jabber server costs about a week and some hosting, and keeps that list out of anyone else's hands.", "o": ["Yes: X2F runs its own onion-only Jabber server and connects over Tor", "Use a public Jabber server over the normal internet for now"], "r": 0}, {"s": "Jabber alerts", "q": "May X2F merge several waiting alerts into one message, with a minimum gap per person?", "n": "As built, every change sends its own message at once. A team member could flood the team owner's Jabber, and one flood delays everyone's alerts. Merging waiting alerts into one message, and sending to the same person at most every few minutes, prevents that.", "o": ["Yes, merge them and keep a minimum gap", "No, one message per change"], "r": 0}, {"s": "Jabber alerts", "q": "Should the \"send a test message\" button have extra limits?", "n": "Setting up Jabber sends a test code to any address, 5 a day per account and 2,000 a day site-wide. About 400 throwaway accounts could use the whole daily budget, and messaging strangers risks X2F's sending account being reported as spam, which would stop every alert. Proposed: the account must be a few days old, a cap per Jabber domain, and a separate sending account for tests.", "o": ["Yes, add those limits", "Keep it simple as built"], "r": 0}, {"s": "Jabber alerts", "q": "Should a login send a Jabber alert?", "n": "As built, logins send nothing. A thief who logs in and changes nothing is never reported. New devices already need approval from a device that's logged in, so the useful case is a login from a device that wasn't approved by you.", "o": ["Only logins from a new device", "Every login", "No login alerts"], "r": 0}, {"s": "Jabber alerts", "q": "When a dispute is opened, who gets the Jabber alert?", "n": "As built, only the paying side is told. The other trader learns it when they open the app.", "o": ["Both traders", "Only the paying side, as built"], "r": 0}, {"s": "Jabber alerts", "q": "Should things that happen on a timer, like a 24-hour hold ending or a team invite expiring, send a Jabber alert?", "n": "As built, only changes someone makes send alerts. A hold ending is a security moment (the waiting change applies); an invite expiring is housekeeping.", "o": ["Alert when a hold ends; nothing for expiring invites", "Alert for both", "Neither"], "r": 0}, {"s": "Disputes", "q": "You said 72 hours to file a dispute. Which window is that?", "n": "Two windows exist today. One: after a trade is refunded or closed, how long a trader has to open a dispute about it (built as 48 hours). Two: after a ruling, how long the loser has to appeal (also 48 hours, your 29 Oct ruling). Which one becomes 72 hours?", "o": ["Only the window to open a dispute after a trade closes: 72 hours; appeals stay 48", "Both become 72 hours", "Only appeals become 72 hours; disputes stay 48"], "r": 0}, {"s": "Signing up", "q": "Still open from question 24: should the signup form check live whether the private username is free?", "n": "Your answer to 24 described the start of signup (terms, then rules, then signature, then continue). Noted and sent to design. The username question is still open: a live \"available\" tick on the PRIVATE username lets strangers test about 14,000 names a day; the public display name can have a tick safely.", "o": ["Live tick only for the public display name; the private username is checked at the end", "No live tick at all; both names checked at the end, as before", "Keep a live tick for the private username too"], "r": 0}, {"s": "Time to pay", "q": "The research on every payment method is done. Do you accept these five time tiers?", "n": "109 methods were checked (providers' own pages where they exist). Window = time for the money to arrive plus a fair margin for a person to actually send it, rounded up to one of five tiers.\n60 min: same-app transfers (Revolut, Cash App, Venmo, PayPal, Skrill, M-PESA...): 36 methods.\n90 min: instant transfers between banks (Zelle, Interac, Faster Payments, SEPA Instant, Pix, UPI, Bizum, Swish...): 33 methods.\n3 h: slower bank transfers (India NEFT/IMPS, Japan, Wise), remittance (Western Union, MoneyGram, Remitly...) and all gift cards: 30 methods.\n24 h: standard SEPA, US domestic wire, Wise USD, cash deposit at a bank, cash in person: 6 methods.\n72 h: US ACH, SWIFT wire, cash by mail, money orders: 4 methods.\nFull list with sources: research/payment-method-timing/REPORT.md on branch wip/lead-research-1109. Almost no provider publishes a true average; the tiers use their stated typical times.", "o": ["Yes, use these five tiers", "Change some (write which below)"], "r": 0}, {"s": "Time to pay", "q": "One clock or two for slow methods?", "n": "Your rule: the same number is the time the buyer has to send AND the wait before the seller can cancel. As built there are two clocks: a short time to send, then a separate wait for the money to arrive. For instant methods it makes no difference. For a 72-hour method it does: with one clock, a seller whose buyer never pays waits 72 hours before cancelling; with two, a no-show (nothing sent, no proof) can be cancelled after a few hours while a buyer who sent proof keeps the full 72 hours.", "o": ["Two clocks: a few hours to send and show proof, then the full window for the money to arrive", "One clock: the full window before anything can be cancelled"], "r": 0}, {"s": "Time to pay", "q": "Bank methods don't move at weekends or holidays. What should happen to a 24-hour window that starts on a Friday night?", "n": "Standard SEPA, wires and ACH only settle on business days. A fixed 24-hour window starting Friday evening cannot be met.", "o": ["Pause the clock over weekends and bank holidays for those methods", "Make those methods' windows longer instead", "Hide those offers at weekends"], "r": 0}, {"s": "Time to pay", "q": "Cash pickup services (Western Union, MoneyGram, Ria, HalCash, Cash at ATM): the sender can cancel until the cash is collected. Should the seller be told to collect before releasing?", "n": "This is a release rule, not a time rule: a seller who releases the XMR before collecting the cash can lose it if the buyer cancels the transfer.", "o": ["Yes: the method's instructions and the release screen say \"collect the cash first\"", "No special rule"], "r": 0}, {"s": "Prices", "q": "A fourth XMR price source (CoinPaprika) is built. Turn it on by default once it passes the Tor check?", "n": "Today the server uses three sources and their median. The fourth is built and tested, but kept off until it is checked over Tor on the real server. The source is never shown to users.", "o": ["Yes, on by default once it passes the Tor check", "Keep it off; turn it on only if one of the three fails"], "r": 0}, {"s": "Prices", "q": "For currencies priced through an exchange-rate step (USD to local), how far apart may the exchange-rate sources be before that currency's price is paused?", "n": "Your 3% rule covers the XMR price sources. Local currencies also use a dollar exchange rate from separate sources. The builder suggests the same 3%.", "o": ["3%, the same as the XMR sources", "5%", "Something else (write below)"], "r": 0}, {"s": "Accounts", "q": "Reminder of the 60-day rule you set on 6 Nov, then two questions: warn before, and can staff reopen?", "n": "On 6 Nov you ruled: an account that is not logged into for 60 days closes automatically; to trade again the person opens a new account. (Trades delete at 30 days, disputes at 90, as before; this is a separate rule about idle accounts.) On 7 Nov you asked to be reminded. Two things were left open: should the person get a warning before the close (for example a week before, by Jabber if set up), and may staff reopen an account that closed by mistake (a bank outage, a long trip)?", "o": ["Keep the 60-day close; warn a week before; staff may reopen within 30 days", "Keep the 60-day close with no warning and no reopening", "Drop the 60-day close"], "r": 0}, {"s": "Offers", "q": "What must make a second amount band different from the first?", "n": "You said bands must differ by something real, and that we had not settled what. Candidates: a different amount range (no overlap), a different minimum number of completed trades, a different price margin, or a different set of payment types. At most 3 bands per currency.", "o": ["At least one of: non-overlapping amounts, a different minimum trades, a different margin, or different payment types", "Only non-overlapping amount ranges", "Only a different minimum number of completed trades"], "r": 0}, {"s": "Reputation", "q": "Should the person being reviewed see who reviewed them?", "n": "Your 28 Oct rule makes reviews anonymous to the public: no name, no account number. The design's private Reviews screen (what a trader sees about their own reviews) still shows the reviewers' usernames. Design asks whether that private view should also hide names.", "o": ["No: the reviewed person sees no names either; reviews are anonymous everywhere", "Yes: the reviewed person sees who reviewed them; only the public is kept anonymous"], "r": 0}, {"s": "Reputation", "q": "Should a public profile show \"Disputes: N won, M lost\"?", "n": "On 28 Oct you were leaning yes. Moderators see it already. Nothing is drawn on the public profile until you decide.", "o": ["Yes, show won and lost counts on the public profile", "Show only the lost count", "Show nothing about disputes on the profile"], "r": 0}, {"s": "Escrow money", "q": "Two of your rules meet: does extra XMR before \"I've paid\" still grow the trade, or does every automatic payout pay fixed amounts and the extra stay in the escrow?", "n": "20 Oct: extra XMR sent before \"I've paid\", within the offer's limits, grows the trade at the same rate and both sides see the new total. 30 Oct: automatic payouts pay ONLY the agreed amounts, anything extra stays in the escrow until the seller opens a dispute. Main still grows the trade. The builder stopped here because the two cannot both be true.", "o": ["Fixed amounts: the trade never grows; any extra stays in the escrow (30 Oct wins)", "Keep growing the trade up to the offer maximum; only the extra above it stays in the escrow"], "r": 0}, {"s": "Escrow money", "q": "Leaving extra in the escrow needs an engine change: may a payout send change back to the escrow's own address?", "n": "Today the escrow engine refuses any payout that does not empty the escrow, on purpose: a payout with \"change\" could hide a payment to the builder. To leave surplus behind, the engine would allow change ONLY to the escrow's own multisig address, which still cannot be spent without two keys. This is a security change to the co-signing rules, so it is your call.", "o": ["Yes: allow change only to the escrow's own address, with a test that any other change address is refused", "No: keep \"every payout empties the escrow\"; surplus goes to the seller as today"], "r": 0}, {"s": "Escrow money", "q": "Who may open a dispute on a finished trade that still holds extra XMR, and for how long?", "n": "Today nobody can dispute a released or cancelled trade, and only the buyer can dispute a refunded one (48 hours). For the seller to get the extra out through a moderator, the seller needs a way to open that dispute.", "o": ["The seller may open a \"surplus\" dispute on any finished trade while the escrow still holds coins, no time limit", "Within the normal after-trade dispute window only (the 72 or 48 hours of question 51)", "Something else (write below)"], "r": 0}, {"s": "Escrow money", "q": "Confirm the payout fee estimate the seller funds on top: 0.0001 XMR?", "n": "Your 30 Oct choice: the seller's funding amount includes a small estimate of the payout network fee so payouts pay exact amounts; what is left over counts as extra. The app already says \"about 0.0001 XMR\" (a few cents). The seller's funding request would show the trade amount plus this estimate.", "o": ["Yes, 0.0001 XMR", "A different number (write below)"], "r": 0}, {"s": "24-hour hold", "q": "From a username-and-password login, is changing your own session length (2, 4, 8 or 12 hours) or the idle reminder held 24 hours too?", "n": "You said the hold is only on the changes being made, and everything else works as normal. Session length and the idle reminder change nothing about who can get in, and extending a session already asks for a confirmation. The builder treats them as NOT held. Security changes (login methods, password, wallets, team) stay held.", "o": ["Not held: session length and idle reminder apply at once", "Held 24 hours like every other change"], "r": 0}, {"s": "Funding the audit", "q": "The grant drafts (Monero CCS, OTF Red Team Lab, NLnet) are written. They all expect open-source code. Your 27 Oct rule is \"not open source for now\". Which way?", "n": "Drafts sit in the repository, marked not sent. Monero's community fund and the two foundations fund work the public can inspect, so applying means publishing the code under a licence. The alternative is to keep the code private, skip the grants, and pay for the audit from early revenue as you said on 8 Nov. The 2-4 page public description of the cryptography can be published either way.", "o": ["Keep the code private for now; skip the grants; publish only the crypto description", "Open the code under a licence and apply (I'll pick the licence with the lawyer)", "Open only the cryptography packages and apply with those"], "r": 0}, {"s": "Owner account", "q": "Your serious actions need both of your security keys tapped. If one key is lost or broken, how do you get back in?", "n": "Your rule: the owner logs in with a PGP key and a security key, and the most serious actions need both of your two YubiKeys. Design asks what happens when one is lost. Options: a third key kept offline, registered now; or a recovery that uses the remaining key plus your PGP key plus a 24-hour wait; or no recovery (a lost key means the site is locked until a new key is set up from a trusted backup).", "o": ["Register a third key now and keep it offline", "Remaining key + PGP key + 24-hour wait", "No recovery path; I keep spare keys registered myself"], "r": 0}, {"s": "Proof", "q": "Wording for the rule-list line about the first-month \"Was this blurred correctly?\" check: pick one.", "n": "Your p9-8 ruling asks both parties, every proof, for the first month or two whether the privacy tool hid the right things, then only now and then. The rule list on the trade screens needs one line for it.", "o": ["\"For the first weeks we ask after every proof whether our privacy tool hid the right details. It takes one tap.\"", "\"We may ask you to check that our privacy tool hid the right details on a proof.\"", "Different words (write below)"], "r": 0}, {"s": "Signing up", "q": "Should the recovery code be truly required (the server refuses to finish signup without it), or is the screen's requirement enough?", "n": "The signup screen now refuses to continue until the person ticks \"I've written it down\" and types one code back. A person who bypasses the screen (reload, direct link) could still end up without a saved code. Only that person is at risk: a lost code means a lockout, no money. Making the server enforce it is a day's work.", "o": ["The screen's requirement is enough for now", "The server must enforce it too"], "r": 0}, {"s": "Terms", "q": "Should staff re-sign when the Terms change, like traders and team members do?", "n": "Traders and team members are sent back to the Terms whenever the version changes. Staff sign once at their invite and are never asked again.", "o": ["Yes, staff re-sign at every Terms change", "No, once at the invite is enough"], "r": 0}, {"s": "Terms", "q": "Your own owner account has no signature. Is that intended?", "n": "You ruled that everyone who gets a login signs. The owner account is created at setup, before the Terms exist in the app, so it never signs.", "o": ["Yes, the owner account is the exception", "No, I sign too at setup"], "r": 0}, {"s": "Terms", "q": "The Terms must mention the signature. Approve this line for the lawyer's draft?", "n": "Section 7 says X2F asks for no name, yet the signature pad says \"sign your name\". Proposed line for the Terms: \"When you open an account we keep the signature you draw or type, only to show that you agreed. It is erased when your account closes. It does not have to be your legal name or real signature.\"", "o": ["Yes, use it (the lawyer may reword later)", "Different words (write below)"], "r": 0}, {"s": "Maintenance", "q": "Should a visitor who is not logged in see the announced maintenance plan on the front door, or only \"planned maintenance\" with the details after login?", "n": "Your rule makes planned maintenance announced about a day ahead with a start and end. The front door shows nothing behind the curtain to outsiders.", "o": ["Only the kind (planned or unplanned) and when it ends; details after login", "The full announcement to everyone"], "r": 0}, {"s": "Money", "q": "Fee wallet sweep: what balance should trigger moving fees to your cold wallet, and how much stays behind?", "n": "Built and switched off. When on: once the fee wallet's balance passes a threshold you set, the excess above a reserve moves to your cold address and you get an alert. The reserve is \"one day plus one night of staff pay\" as a fixed XMR number you set (there is no staff pay data yet to compute it). Write both numbers, or leave it off for now.", "o": ["Leave it off until after launch", "Turn it on (write the threshold and the reserve in XMR below)"], "r": 0}, {"s": "Money", "q": "After a fee sweep fails or is interrupted, nothing more moves until you re-save the sweep settings. OK?", "n": "A failed or half-done move stops every later sweep and alerts you once. Saving the settings again (with your security key) clears it. The alternative is automatic retries, which could repeat a half-done move.", "o": ["Yes, stop and wait for me", "Retry automatically once a day and alert each time"], "r": 0}, {"s": "Account compromised", "q": "\"My account has been compromised\": who may freeze an account, and on what proof?", "n": "As built, the form needs no login: anyone who knows a username can freeze that account and all its open trades until staff clear it. The limits allow a script about 170,000 freezes a day. The security review says that is a weapon against honest traders. You said the person gives \"whatever credentials they still have\".", "o": ["Freeze at once only if one credential (password, recovery code or key) verifies; otherwise open an urgent staff ticket instead of freezing", "Freeze on the name alone, but with a hard limit and an alarm to staff", "Keep as built"], "r": 0}, {"s": "Account compromised", "q": "When staff unlock a frozen account, what happens to its logins?", "n": "As built, unlocking restores every login method, including any a thief added or stole, so the thief can log straight back in.", "o": ["The person must set up their logins again at the next login (old methods revoked)", "Staff revoke the methods the thief could hold as part of the unlock, case by case", "Restore everything as built"], "r": 0}, {"s": "Account compromised", "q": "While an account is frozen, may the other trader in its open trades still open a dispute?", "n": "As built, every action on a frozen account's trades is refused, including the other side opening a dispute. Your G7 rule says both people on a held trade can still reach moderators. A cheat could freeze their own account to stall.", "o": ["Yes: the other side may open a dispute; its timers stay paused", "No: everything waits until staff unfreeze"], "r": 0}, {"s": "Gift cards", "q": "Time to pay for a gift card: how long does the buyer get to send the card code?", "n": "The 45-minute window you set is for the seller to check the card. The buyer's time to send the code has no number yet; the research tier for gift cards is 3 hours (time to buy the card). The build needs one.", "o": ["3 hours (research tier)", "90 minutes", "Something else (write below)"], "r": 0}, {"s": "Gift cards", "q": "PaysafeCard was removed from the gift-card list along with Razer Gold. Right?", "n": "Your brand list named Razer Gold as dropped. The builder also dropped PaysafeCard, reading it as not a gift card. PaysafeCard is a prepaid code sold in shops.", "o": ["Keep PaysafeCard as a payment method (not a gift card)", "Drop it as the builder did"], "r": 0}, {"s": "Disputes", "q": "\"Kept 90 days after the dispute closes\": does \"closes\" mean after any appeal is decided too?", "n": "A ruling can be appealed within 48 hours (or 72 if you move it). If the 90 days start at the first ruling, an appeal might still be running when the records are due to go.", "o": ["Yes: the 90 days start when the dispute is final, appeal included", "No: from the first ruling"], "r": 0}, {"s": "24-hour hold", "q": "During a 24-hour hold, may the held login still approve a new device?", "n": "Your 9 Nov rule says the hold holds only the change being made and everything else works. The older hold rule also blocked approving new logins or devices during the hold, because a thief who got in could otherwise let in a second device.", "o": ["Keep blocking new-device approval during the hold (security exception)", "Allow it, like everything else"], "r": 0}, {"s": "Sessions", "q": "If you log out in one browser tab, should your other open tabs log out at the same instant?", "n": "Today another tab finds out only at its next request to the server (within 15 seconds on a trade screen, or at the next tap elsewhere). Telling the other tabs at once is a small change and closes the gap on a shared computer.", "o": ["Yes, all tabs log out at once", "No, leave it as it is"], "r": 0}, {"s": "Trade room", "q": "\"Trading with more than one person?\" courtesy note: should \"Don't show this again\" be remembered on the account (all devices) or only on that phone?", "n": "Built on the device for now because the server has no such setting. An account setting is a small addition.", "o": ["On the account: once ticked, no device shows it again", "On the device only, as built"], "r": 0}, {"s": "Accounts", "q": "The 60-day inactivity close: does it apply to every account, or only to vendor accounts?", "n": "Your 6 Nov answer was about vendors (an inactive vendor closes after 60 days; to trade again, open a new account). The signup screen's new line says any account closes. This also decides question 59.", "o": ["Every account", "Vendor accounts only"], "r": 0}, {"s": "Offers", "q": "When should the two traders see the chosen payment method's locked instructions (account name, email, memo rules)?", "n": "Built: both see them only once the escrow is secured (10 of 10 confirmations), the same moment the buyer may pay. Showing them earlier lets a taker collect vendors' payment details without ever funding.", "o": ["Only once the escrow is secured, as built", "As soon as the trade is taken"], "r": 0}, {"s": "Offers", "q": "An offer priced in XMR (not in a local currency): one amount band per currency, or up to three like fiat offers?", "n": "Fiat offers get up to 3 bands per currency. For XMR-priced offers the builder allowed one band per currency, because the XMR range is the same in every currency and bands would only differ by margin.", "o": ["One band per currency for XMR offers, as built", "Up to three, like fiat offers"], "r": 0}, {"s": "Teams", "q": "Team member abilities are built as tick boxes (page 13). Is \"send platform feedback\" a box the lead grants, or does every member always have it?", "n": "Your 6 Nov answer made feedback per member and tickets shared across the team. Today every existing member keeps feedback; a new member only gets it if the lead ticks the box.", "o": ["A box the lead grants (as built)", "Every member always has it"], "r": 0}, {"s": "24-hour hold", "q": "A buyer cancels while the SELLER's account is on a 24-hour hold. The cancel waits until the hold ends. Should the buyer be able to open a dispute meanwhile?", "n": "Your rules: a buyer can cancel only before \"I've paid\" and can dispute only after it; a held account's partner may reach a moderator (G7). Here nothing has been paid, so there is nothing for a moderator to rule on, and the waiting cancel already returns the coins when the hold ends.", "o": ["No: the waiting cancel is the buyer's way out; no dispute", "Yes: the buyer may open a dispute while the cancel waits"], "r": 0}, {"s": "Teams", "q": "A team member with the \"end the hold\" right can bring forward the lead's waiting security changes made from a weak login. Keep that right grantable?", "n": "Your 7 Nov answer (p4-8) made three hold rights grantable to members: see waiting changes, untick or cancel them, end the hold. Ending the hold applies the lead's waiting changes at once, including a password change, which is what the 24-hour hold is meant to delay if a thief made it. The review marks it high risk.", "o": ["Keep it grantable, marked high risk, with a warning when ticked", "Remove \"end the hold\" from members; keep see and cancel"], "r": 0}, {"s": "Teams", "q": "When you confirm a member's abilities with your PGP key, what should the signed text list?", "n": "Today the text you decrypt says only \"N abilities\". A compromised page could swap the boxes without changing that text. Listing the box names in the signed text closes that gap; the list can be long.", "o": ["List every box name in the signed text", "List only the high-risk boxes by name, plus the count", "Keep the count only"], "r": 0}, {"s": "Flex offers", "q": "A trade keeps the seller's payment instructions (bank details, IBAN) forever. Clear them after 90 days?", "n": "Today the 90-day purge clears only the payout and refund addresses. The bank details copied into the trade stay in the database for good. Lead recommends clearing them at 90 days with the addresses.", "o": ["Clear them at 90 days with the addresses", "Keep them forever", "Clear them when the trade closes"], "r": 0}, {"s": "Flex offers", "q": "Relisting an offer priced in several currencies when one currency has no price feed right now: what happens?", "n": "The $5,000 ceiling is checked at relist against each currency's market rate. Lead recommends relisting the priced currencies and leaving the unpriced one hidden until its rate returns.", "o": ["Relist the priced currencies; the unpriced one stays hidden until its rate returns", "Refuse the whole relist until every currency has a rate"], "r": 0}, {"s": "Flex offers", "q": "May two amount bands on one offer differ only in their margin?", "n": "If they differ only in margin, the worse band is never used, because the taker always gets the best band they qualify for. Lead recommends no: bands must differ by amount range, minimum trades or payment types.", "o": ["No, bands must differ by range, minimum trades or payment types", "Yes, allow it"], "r": 0}, {"s": "Account holds", "q": "A buyer whose seller is under a recovery hold: can the buyer open a dispute during the hold?", "n": "Under the new trade rules a buyer may dispute only after \"I've paid\", and marking paid waits for the hold. So the buyer can neither mark paid nor dispute for the whole hold: 24 hours, or up to 30 days if staff extend it. Before the new rules they could dispute. No coins move either way. Both the port builder and the reviewer flagged it; the reviewer recommends letting the buyer dispute.", "o": ["Let the buyer open a dispute on a held, secured trade", "Keep it: the buyer waits, and a recorded cancel is their way out"], "r": 0}, {"s": "Sign-up", "q": "Saving recovery codes needs a tap on the recovery screen. That breaks the visitor rule of one tap per board. Does the recovery-code rule win?", "n": "Your ruling S-017 (codes must be saved) and the one-tap rule collide on that one screen. Lead recommends S-017 wins.", "o": ["Yes, the recovery-code rule wins", "No, show the codes without a save tap"], "r": 0}, {"s": "Sign-up", "q": "The password strength meter can only say \"Strong\" after the server confirms the password is not in a leak list. Nothing is checked until \"Set password\" is tapped, so the meter reads \"Checking…\" until then. OK?",
