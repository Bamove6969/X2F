<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your badges</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600&amp;family=Atkinson+Hyperlegible+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
button:focus-visible,a:focus-visible{outline:2px solid #eef1f5;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0e1116; color: #eef1f5; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; display: flex; flex-direction: column;">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px; border-bottom: 1px solid #20262f;">
    <a href="Profile.dc.html" aria-label="Back" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: #eef1f5;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Familjen Grotesk', sans-serif; font-size: 22px; font-weight: 600;">Your badges</h1>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
    <section aria-label="Preview" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; border: 1px dashed #6b7584;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #9aa4b2;">On your offers</span>
      <span style="font-size: 16px; font-weight: 600;">mira.k</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; min-height: 24px;">
        <sc-for list="{{featured}}" as="b" hint-placeholder-count="2">
          <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #4cc3d9; border: 1px solid #4cc3d9; border-radius: 999px; padding: 3px 8px;">{{b.name}}</span>
        </sc-for>
        <sc-if value="{{hasMore}}" hint-placeholder-val="{{true}}">
          <span style="font-size: 12px; font-weight: 600; color: #9aa4b2; border: 1px solid #6b7584; border-radius: 999px; padding: 3px 8px;">+{{moreCount}}</span>
        </sc-if>
      </div>
      <span style="font-size: 13px; color: #9aa4b2;">Featured {{featuredCount}} of 2</span>
    </section>

    <sc-if value="{{notice}}" hint-placeholder-val="{{false}}">
      <p role="status" style="margin: 0; font-size: 13px; line-height: 18px; color: #f2c14e;">{{noticeText}}</p>
    </sc-if>

    <section aria-label="Earned badges" style="display: flex; flex-direction: column; gap: 4px;">
      <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #9aa4b2;">Earned</h2>
      <sc-for list="{{earned}}" as="b" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid #20262f;">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px; font-weight: 600;">{{b.name}}</span>
            <span style="font-size: 13px; color: #9aa4b2;">{{b.meaning}}</span>
          </div>
          <div role="radiogroup" aria-label="{{b.name}} visibility" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #171b22;">
            <button type="button" role="radio" aria-checked="{{b.fOn}}" onClick="{{b.setF}}" style="{{b.fStyle}}">Featured</button>
            <button type="button" role="radio" aria-checked="{{b.hOn}}" onClick="{{b.setH}}" style="{{b.hStyle}}">On hover</button>
            <button type="button" role="radio" aria-checked="{{b.xOn}}" onClick="{{b.setX}}" style="{{b.xStyle}}">Hidden</button>
          </div>
        </div>
      </sc-for>
    </section>

    <section aria-label="Next milestones" style="display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #9aa4b2;">Next milestones</h2>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 14px;"><span>500 trades</span><span style="font-family: 'Atkinson Hyperlegible Mono', monospace; color: #9aa4b2;">212 / 500</span></div>
        <div role="progressbar" aria-label="500 trades" aria-valuemin="0" aria-valuemax="500" aria-valuenow="212" style="height: 6px; border-radius: 999px; background: #20262f; overflow: hidden;"><span style="display: block; width: 42%; height: 100%; background: #6b7584;"></span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 14px;"><span>Clean record</span><span style="font-family: 'Atkinson Hyperlegible Mono', monospace; color: #9aa4b2;">88 / 100</span></div>
        <div role="progressbar" aria-label="Clean record" aria-valuemin="0" aria-valuemax="100" aria-valuenow="88" style="height: 6px; border-radius: 999px; background: #20262f; overflow: hidden;"><span style="display: block; width: 88%; height: 100%; background: #6b7584;"></span></div>
      </div>
      <p style="margin: 0; font-size: 12px; color: #9aa4b2;">The New badge always shows while you have it and can't be hidden.</p>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      vis: { 'Trusted': 'f', 'Fast': 'f', 'Veteran': 'h', 'PGP verified': 'h', 'Security key verified': 'h', '100 trades': 'x' },
      order: ['Trusted', 'Fast'],
      notice: ''
    };
  }
  set(name, level) {
    const vis = Object.assign({}, this.state.vis);
    let order = this.state.order.filter((n) => n !== name);
    let notice = '';
    if (level === 'f') {
      if (order.length >= 2) {
        const bumped = order.shift();
        vis[bumped] = 'h';
        notice = bumped + ' moved to On hover. Only 2 badges can be featured.';
      }
      order.push(name);
    }
    vis[name] = level;
    this.setState({ vis, order, notice });
  }
  renderVals() {
    const meanings = {
      'Trusted': '100+ trades and 98%+ positive',
      'Fast': 'Usually pays or releases within 10 min',
      'Veteran': 'Trading on X2F for 1+ year',
      'PGP verified': 'Signs in with a verified PGP key',
      'Security key verified': 'Protects the account with a hardware key',
      '100 trades': 'Completed 100 trades'
    };
    const { vis, order, notice } = this.state;
    const seg = (on) => 'height: 36px; border: 0; border-radius: 999px; font-family: inherit; font-size: 13px; cursor: pointer; ' + (on ? 'background: #20262f; color: #eef1f5; font-weight: 600; box-shadow: inset 0 0 0 1px #ff7a1a;' : 'background: transparent; color: #9aa4b2;');
    const earned = Object.keys(meanings).map((name) => ({
      name, meaning: meanings[name],
      fOn: vis[name] === 'f' ? 'true' : 'false', hOn: vis[name] === 'h' ? 'true' : 'false', xOn: vis[name] === 'x' ? 'true' : 'false',
      fStyle: seg(vis[name] === 'f'), hStyle: seg(vis[name] === 'h'), xStyle: seg(vis[name] === 'x'),
      setF: () => this.set(name, 'f'), setH: () => this.set(name, 'h'), setX: () => this.set(name, 'x')
    }));
    const hover = Object.keys(vis).filter((n) => vis[n] === 'h').length;
    return {
      earned,
      featured: order.map((name) => ({ name })),
      featuredCount: order.length,
      hasMore: hover > 0,
      moreCount: hover,
      notice: !!notice,
      noticeText: notice
    };
  }
}
</script>
</body>
</html>
