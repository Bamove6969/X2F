<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sell XMR: payment methods</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600&amp;family=Atkinson+Hyperlegible+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #eef1f5;outline-offset:2px}
input::placeholder{color:#9aa4b2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0e1116; color: #eef1f5; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; display: flex; flex-direction: column;">
  <header style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 12px; border-bottom: 1px solid #20262f;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-family: 'Familjen Grotesk', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.02em;">X2F</span>
      <div role="tablist" aria-label="Buy or sell" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #171b22;">
        <button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: #9aa4b2; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Buy</button>
        <button type="button" role="tab" aria-selected="true" style="height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: #20262f; color: #eef1f5; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Sell</button>
      </div>
    </div>
    <h1 style="margin: 0; font-family: 'Familjen Grotesk', sans-serif; font-size: 24px; line-height: 30px; font-weight: 600;">How do you want to get paid?</h1>
    <div style="display: flex; gap: 8px;">
      <label for="cur" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Currency</label>
      <select id="cur" style="height: 44px; padding: 0 10px; border-radius: 6px; border: 1px solid #6b7584; background: #20262f; color: #eef1f5; font-family: inherit; font-size: 15px;">
        <option>USD</option><option>EUR</option><option>GBP</option><option>CAD</option><option>BRL</option><option>INR</option>
      </select>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Search payment methods</label>
      <input id="q" type="search" value="{{query}}" onChange="{{onQuery}}" placeholder="Search {{total}} payment methods" style="flex-grow: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #6b7584; background: #20262f; color: #eef1f5; font-family: inherit; font-size: 16px;">
    </div>
    <div role="radiogroup" aria-label="Sort" style="display: flex; gap: 8px; align-items: center;">
      <span style="font-size: 13px; color: #9aa4b2;">Sort</span>
      <sc-for list="{{sorts}}" as="s" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 16px;">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column;">
        <h2 style="margin: 8px 0; font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #9aa4b2;">{{sec.title}}</h2>
        <sc-for list="{{sec.rows}}" as="m" hint-placeholder-count="4">
          <a href="SellOffers.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; border-bottom: 1px solid #20262f;">
            <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
              <span style="font-size: 16px; font-weight: 600;">{{m.name}}</span>
              <span style="{{m.subStyle}}">{{m.sub}}</span>
            </span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa4b2" stroke-width="1.5" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"/></svg>
          </a>
        </sc-for>
      </section>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <p style="margin: 24px 0; font-size: 15px; line-height: 22px; color: #9aa4b2; text-align: center;">No method called "{{query}}" yet. You can post an offer with a custom payment method.</p>
    </sc-if>
    <p style="margin: 0; font-size: 12px; color: #9aa4b2;">Buyer counts and rates are examples.</p>
  </main>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #20262f; background: #0e1116;">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 60px; color: #ff6600; font-size: 12px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 7h13l-3-3"/><path d="M17 17H4l3 3"/></svg>Trade</a>
    <a href="PostOffer.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 60px; color: #9aa4b2; font-size: 12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Post offer</a>
    <a href="Wallet.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 60px; color: #9aa4b2; font-size: 12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2"/></svg>Wallets</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 60px; color: #9aa4b2; font-size: 12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sort: 'buyers', query: '' };
  }
  renderVals() {
    // [name, group, example USD buyers, example best USD rate]. Names: Haveno's method list (data/payment-methods.json).
    const data = [
      ["Uphold", "Payment apps", 0, 0.00],
      ["MoneyBeam (N26)", "Payment apps", 0, 0.00],
      ["Revolut", "Payment apps", 6, 330.40],
      ["Perfect Money", "Payment apps", 0, 0.00],
      ["SEPA", "Bank transfers", 0, 0.00],
      ["SEPA Instant", "Bank transfers", 0, 0.00],
      ["SPEI", "Bank transfers", 0, 0.00],
      ["Faster Payments (UK)", "Bank transfers", 0, 0.00],
      ["GCash", "Payment apps", 0, 0.00],
      ["National bank transfer", "Bank transfers", 0, 0.00],
      ["Japan bank transfer (Furikomi)", "Bank transfers", 0, 0.00],
      ["PayID (Australia)", "Bank transfers", 0, 0.00],
      ["Transfer within the same bank", "Bank transfers", 0, 0.00],
      ["Transfer with specific banks", "Bank transfers", 0, 0.00],
      ["Swish", "Payment apps", 0, 0.00],
      ["Alipay", "Payment apps", 0, 0.00],
      ["WeChat Pay", "Payment apps", 0, 0.00],
      ["Zelle", "Payment apps", 34, 331.20],
      ["Interac e-Transfer", "Bank transfers", 0, 0.00],
      ["US Postal money order", "Cash & money orders", 2, 334.50],
      ["Cash deposit at bank", "Cash & money orders", 3, 333.40],
      ["Mercado Pago", "Payment apps", 0, 0.00],
      ["MoMo", "Payment apps", 0, 0.00],
      ["MoneyGram", "Cash & money orders", 1, 334.00],
      ["Western Union", "Cash & money orders", 2, 334.00],
      ["HalCash", "Cash & money orders", 0, 0.00],
      ["Cash in person (face to face)", "Cash & money orders", 7, 335.00],
      ["PromptPay", "Bank transfers", 0, 0.00],
      ["Advcash", "Payment apps", 0, 0.00],
      ["Wise", "Payment apps", 8, 330.10],
      ["Wise (USD)", "Payment apps", 0, 0.00],
      ["Paysera", "Payment apps", 0, 0.00],
      ["Paxum", "Payment apps", 0, 0.00],
      ["NEFT (India)", "Bank transfers", 0, 0.00],
      ["RTGS (India)", "Bank transfers", 0, 0.00],
      ["IMPS (India)", "Bank transfers", 0, 0.00],
      ["UPI", "Bank transfers", 0, 0.00],
      ["Paytm", "Payment apps", 0, 0.00],
      ["Nequi", "Payment apps", 0, 0.00],
      ["Bizum", "Payment apps", 0, 0.00],
      ["PIX", "Bank transfers", 0, 0.00],
      ["Amazon eGift card", "Gift cards & vouchers", 6, 352.00],
      ["Cash by mail", "Cash & money orders", 21, 338.00],
      ["Cash at ATM", "Cash & money orders", 0, 0.00],
      ["Capitual", "Payment apps", 0, 0.00],
      ["CelPay", "Payment apps", 0, 0.00],
      ["Monese", "Payment apps", 0, 0.00],
      ["M-Pesa", "Payment apps", 0, 0.00],
      ["Satispay", "Payment apps", 0, 0.00],
      ["Tikkie", "Payment apps", 0, 0.00],
      ["Verse", "Payment apps", 0, 0.00],
      ["Strike", "Payment apps", 2, 330.00],
      ["International wire (SWIFT)", "Bank transfers", 3, 329.40],
      ["Bank transfer (ACH)", "Bank transfers", 15, 330.80],
      ["Domestic wire transfer", "Bank transfers", 4, 329.60],
      ["Cash App", "Payment apps", 27, 332.10],
      ["Venmo", "Payment apps", 12, 333.00],
      ["PayPal", "Payment apps", 9, 336.50],
      ["Paysafecard", "Gift cards & vouchers", 0, 0.00],
      ["BLIK", "Payment apps", 0, 0.00],
      ["Vipps MobilePay", "Payment apps", 0, 0.00],
      ["TWINT", "Payment apps", 0, 0.00],
      ["NIP (Nigeria)", "Bank transfers", 0, 0.00],
      ["Pago Móvil", "Bank transfers", 0, 0.00],
      ["QRIS", "Bank transfers", 0, 0.00],
      ["Papara", "Payment apps", 0, 0.00],
      ["Raast", "Bank transfers", 0, 0.00],
      ["PayNow", "Bank transfers", 0, 0.00],
      ["Wero", "Payment apps", 0, 0.00],
      ["FPS (Hong Kong)", "Bank transfers", 0, 0.00],
      ["DuitNow", "Bank transfers", 0, 0.00],
      ["MB WAY", "Payment apps", 0, 0.00],
      ["PayPay", "Payment apps", 0, 0.00],
      ["Ukrainian bank card transfer", "Bank transfers", 0, 0.00],
      ["Kaspi", "Payment apps", 0, 0.00],
      ["Custom method", "Other", 0, 0.00]
    ];
    const { sort, query } = this.state;
    const toRow = (d) => ({
      name: d[0],
      sub: d[2] > 0 ? d[2] + (d[2] === 1 ? ' buyer' : ' buyers') + ' paying in USD · up to $' + d[3].toFixed(2) : 'No USD buyers right now · post an offer',
      subStyle: 'font-size: 13px; line-height: 18px; color: #9aa4b2;'
    });
    const cmp = {
      buyers: (a, b) => b[2] - a[2] || a[0].localeCompare(b[0]),
      rate: (a, b) => b[3] - a[3] || a[0].localeCompare(b[0]),
      az: (a, b) => a[0].localeCompare(b[0])
    }[sort];
    const q = query.trim().toLowerCase();
    let sections;
    if (q) {
      const hits = data.filter((d) => d[0].toLowerCase().indexOf(q) >= 0).sort(cmp);
      sections = hits.length ? [{ title: hits.length + (hits.length === 1 ? ' match' : ' matches'), rows: hits.map(toRow) }] : [];
    } else {
      // Top section comes only from live offers in the chosen currency, never from our own guesses.
      const live = data.filter((d) => d[2] > 0).sort(cmp);
      const rest = data.filter((d) => d[2] === 0).sort((a, b) => a[0].localeCompare(b[0]));
      sections = [
        { title: 'Buyers paying in USD', rows: live.map(toRow) },
        { title: 'All payment methods', rows: rest.map(toRow) }
      ];
    }
    const sortDefs = [['buyers', 'Most buyers'], ['rate', 'Best rate'], ['az', 'A–Z']];
    const sorts = sortDefs.map(([id, label]) => ({
      label,
      on: sort === id ? 'true' : 'false',
      style: 'height: 32px; padding: 0 12px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; ' + (sort === id
        ? 'border: 1px solid #ff6600; background: #20262f; color: #eef1f5; font-weight: 600;'
        : 'border: 1px solid #6b7584; background: transparent; color: #eef1f5;'),
      pick: () => this.setState({ sort: id })
    }));
    return {
      sections, sorts, query,
      total: data.length,
      empty: !!q && sections.length === 0,
      onQuery: (e) => this.setState({ query: e.target.value })
    };
  }
}
</script>
</body>
</html>
